    example: |-
      ```csharp
      [Service]
      public class MonsterSync(ISpatialBroadcastService broadcast)
      {
          // Sent to every client that currently sees this monster, to nobody else.
          public Task Replicate(MonsterEntity monster, IPacketBase packet)
              => broadcast.SendToObserversAsync(monster.InstanceId, packet);
      }
      ```

