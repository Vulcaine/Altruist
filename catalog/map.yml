    example: |-
      ```csharp
      public class MonsterEntity : WorldObject3D, IHibernatable
      {
          public bool IsHibernated { get; set; }
          public bool CanHibernate => !InCombat;
          public void OnHibernate() { /* stop timers */ }
          public void OnWake() { /* resume */ }
      }

