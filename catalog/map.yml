      - Altruist.RoomSender
      - Altruist.BroadcastSender
      - Altruist.IInterceptor
      - Altruist.OutboundQueues
    config:
      - altruist:server:transport:outbound
    example: |-
      ```csharp
      using Altruist;

      [Portal("/game")]
      public class ChatPortal : Portal
      {
          private readonly IAltruistRouter _router;

          public ChatPortal(IAltruistRouter router) => _router = router;

          [Gate("chat")]
          public Task OnChat(ChatPacket packet, string clientId)
              => _router.Broadcast.SendAsync(packet, excludeClientId: clientId);

          [Gate("whisper")]
          public Task OnWhisper(WhisperPacket packet, string clientId)
              => _router.Client.SendAsync(packet.TargetId, packet);
      }
      ```

      ```yaml
      # optional: queue outbound packets so a slow socket never blocks a gate
      altruist:
        server:
          transport:
            outbound:
              mode: queued   # default: direct
      ```

  - name: packets-and-codecs
    title: Packets and codecs
    summary: >-
      Packets are the typed messages sent between client and server, each with a numeric message code. Codecs turn them into bytes: JSON for browsers and debugging, MessagePack for compact binary. The Altruist.Protocol package holds the shared packet contracts, so other projects can use them without the server.
    use:
      - When you define your own message types: implement IPacketBase with a message code from 1000 up.
      - When you choose JSON or MessagePack for all transports or per transport.
      - When you need the built-in packets (handshake, text, success or failed results, sync) or the transport result codes.
      - When you add a new wire format by implementing ICodec and registering it with [CodecProvider].
    avoid:
      - When you handle a packet on the server, use portals-and-routing instead.
      - When you send many numeric rows every tick in a compact positional form, use snapshots instead.
    packages:
      - Altruist
      - Altruist.Protocol
    docs:
      - /docs/networking/packets
      - /docs/networking/codec
      - /docs/networking/client-packets
      - /docs/networking/handshake
      - /docs/extension/codec
    paths:
      - Altruist/Core/Framework/Packet/
      - Altruist/Core/Framework/Codec/
      - Altruist/Core/Framework/Contracts/Codec.cs
      - Altruist/Protocol/
    types:
      - Altruist.IPacketBase
      - Altruist.IPacket
      - Altruist.AltruistPacket
      - Altruist.MessageEnvelope
      - Altruist.ICodec
      - Altruist.Codec.JsonCodec
      - Altruist.Codec.MessagePack.MessagePackCodec
      - Altruist.CodecResolver
    config:
      - altruist:server:transport:codec
    example: |-
      ```csharp
      using MessagePack;
      using System.Text.Json.Serialization;

      // Annotated for both codecs, so it works with JSON and MessagePack
      [MessagePackObject]
      public struct ChatPacket : IPacketBase
      {
          [Key(0)][JsonPropertyName("messageCode")] public uint MessageCode { get; set; }
          [Key(1)][JsonPropertyName("text")] public string Text { get; set; }

          public ChatPacket(string text) { MessageCode = 1000; Text = text; }
      }
      ```

      ```yaml
      altruist:
        server:
          transport:
            codec:
              provider: messagepack     # global default
            websocket:
              enabled: true
              codec:
                provider: json          # browsers get JSON
      ```

  - name: rate-limit
    title: Rate limiting for portals
    summary: >-
      A per-connection token-bucket limiter that runs before every gate handler. It drops packets that come too fast or are too large, and closes the connection of a client that keeps breaking the limits. It is installed from config.yml, with no code.
    use:
      - When clients can spam gates (chat, input, matchmaking) and you want hard limits per gate.
      - When you cap the payload size of incoming packets.
      - When you assign a gate to a bucket in code with [RateLimit("bucket")].
    avoid:
      - When you limit HTTP endpoints, use http-api instead. It has its own named policies (the same [RateLimit] attribute works there).
      - When you need custom per-packet logic that is not a rate, write an IInterceptor (see portals-and-routing).
    packages:
      - Altruist
    docs:
      - /docs/networking/rate-limit
    paths:
      - Altruist/Core/Framework/Networking/RateLimit.cs
    types:
      - Altruist.RateLimitInterceptor
      - Altruist.IRateLimiter
      - Altruist.TokenBucketRateLimiter
      - Altruist.RateLimitOptions
      - Altruist.RateVerdict
      - Altruist.IRateLimitMetrics
    config:
      - altruist:server:transport:rate-limit
    example: |-
      ```yaml
      altruist:
        server:
          transport:
            rate-limit:
              enabled: true
              strikes-to-disconnect: 60
              buckets:
                input:   { capacity: 300, per-second: 90, gates: ["input"] }
                chat:    { capacity: 3,   per-second: 0.6 }
                default: { capacity: 20,  per-second: 20 }
      ```

      ```csharp
      [Portal("/game")]
      public class GamePortal : Portal
      {
          // uses the "chat" bucket from config
          [Gate("chat"), RateLimit("chat")]
          public Task OnChat(ChatPacket packet, string clientId) => Task.CompletedTask;
      }
      ```

  - name: entity-sync
    title: Entity synchronization
    summary: >-
      Delta sync for world entities. Mark properties with [Synced] and the class with [Synchronized], and Altruist sends clients only the properties that changed, as a SyncPacket.
    use:
      - When world objects (players, NPCs) change a few properties per tick and clients should get only the changes.
      - When you send an entity's changes by hand with IAltruistRouter.Synchronize.
    avoid:
      - When you send positional numeric rows for many objects every tick, use snapshots instead.
      - When you send rare, mixed messages, use a normal packet (packets-and-codecs) instead.
    packages:
      - Altruist
    docs:
      - /docs/networking/synchronization
    paths:
      - Altruist/Core/Framework/Networking.cs
    types:
      - Altruist.Networking.ISynchronizedEntity
      - Altruist.Networking.Synchronization
      - Altruist.IClientSynchronizator
      - Altruist.ClientSynchronizator
      - Altruist.SyncPacket
    example: |-
      ```csharp
      using Altruist;
      using Altruist.Networking;

      [Synchronized]                       // sync every engine tick
      [WorldObject("player")]
      public sealed class PlayerEntity : WorldObject3D, ISynchronizedEntity
      {
          public string ClientId { get; set; } = "";   // must not be empty for auto sync

          [Synced(0)] public uint VirtualId { get; set; }
          [Synced(1, SyncAlways: true)] public string Name { get; set; } = "";
          [Synced(2)] public int Health { get; set; } = 100;

          public PlayerEntity(Transform3D transform) : base(transform) { }
      }
      ```

  - name: snapshots
    title: Snapshot schemas
    summary: >-
      A way to declare once in C# how a fast-changing state row (a float array with no field names) is laid out. The same declaration builds the server's allocation-free encoder and exports a JSON schema for the clients' decoders.
    use:
      - When you send numeric state of many objects every tick (players, projectiles, match clock) as compact MessagePack rows.
      - When the server and several clients must agree on what each position of a row means.
    avoid:
      - When only changed properties should travel, use entity-sync instead.
      - When messages are rare or hold names, lists and nested objects, use a plain packet (packets-and-codecs) instead.
    packages:
      - Altruist
    docs:
      - /docs/networking/snapshot-schema
    paths:
      - Altruist/Core/Framework/Networking/Snapshots/
    types:
      - Altruist.Networking.SnapshotRowSchema
      - Altruist.Networking.SnapshotRowSchema<T>
      - Altruist.Networking.SnapshotSchemaSet
      - Altruist.Networking.ISnapshotRowSchema
      - Altruist.Networking.SnapshotField
    example: |-
      ```csharp
      using Altruist.Networking;

      public static class Wire
      {
          // Build once: the encoder compiles into one writer delegate
          public static readonly SnapshotRowSchema<Ship> ShipRow = SnapshotRowSchema.For<Ship>("ship")
              .Int("id", s => s.Id)
              .Number("x", s => s.Body.Position.X)
              .Number("y", s => s.Body.Position.Y)
              .Bool("shielded", s => s.Shielded)
              .Build();
      }

      float[] row = Wire.ShipRow.Encode(ship);          // exactly one row
      Wire.ShipRow.Encode(ship, buffer, offset);        // no allocation
      ```

  - name: pairing
    title: Device pairing
    summary: >-
      Lets two devices find each other through the server: a host (for example the game on a TV) opens a session and shows a short code, and companions (phones) join with that code. The server then relays small payloads between them, such as controller input or WebRTC signalling.
    use:
      - When a phone should act as a controller or second screen for a game on another device.
      - When you need to signal a peer-to-peer (WebRTC) link between two devices.
    avoid:
      - When you need accounts or secure identity, use the security capabilities. Companions need only the code.
      - When the devices may reach different server nodes. Sessions live in one process only.
    packages:
      - Altruist
