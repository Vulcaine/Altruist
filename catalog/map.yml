  - name: unpublished-stores
    title: ScyllaDB and EF Core (not published)
    summary: >-
      Two store modules that live in the repository but are marked IsPackable=false, so they are NOT on NuGet and cannot
      be installed as packages. EFCore has no code yet; ScyllaDB holds only a small model type. Use Postgres today.
    use:
      - When reading the repository: this is where a future ScyllaDB or EF Core store would land.
    avoid:
      - When you need a database today, use postgres. Do not add a package reference to Altruist.ScyllaDB or Altruist.EFCore, it does not exist on NuGet.
      - When you need a different database, implement IGeneralDatabaseProvider yourself (see persistence).
