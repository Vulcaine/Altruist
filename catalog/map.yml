  - name: entity-hibernation
    title: Entity Hibernation
    summary: >-
      Parks entities that no player can see, so they stop costing tick time, and wakes them when an observer comes near.
      The framework hibernates zero-observer entities automatically; you decide what hibernating means for your entity.
    use:
      - When thousands of NPCs or monsters exist but only the ones near players need to be simulated.
      - When your entity must save or clear state when it goes to sleep (IHibernatable.OnHibernate and OnWake).
    avoid:
      - When you need to remove an entity for good. Despawn it.
    packages:
      - Altruist.Gaming
    docs:
      - /docs/gaming/visibility
    paths:
      - Altruist/Gaming/Main/Core/General/Zone/Hibernation.cs
