  - name: visibility
    title: Visibility (Interest Management)
    summary: >-
      Decides every tick which observers can see which world objects, diffs that against the last tick, and raises
      visible and invisible events. It does not send spawn or despawn packets; your game does that in the event handlers.
      It also feeds entity hibernation and sync broadcasting.
    use:
      - When a client should only know about entities near its player.
      - When you must send a spawn or despawn packet to a client at the moment an entity enters or leaves its view.
      - When you need to know who is looking at an entity (GetObserversOf).
    avoid:
      - When you need to broadcast one packet to everyone near a point. Use [spatial-broadcast].
      - When the game has no spatial world, such as a lobby or card game. Skip it.
    packages:
      - Altruist.Gaming
    docs:
      - /docs/gaming/visibility
    paths:
      - Altruist/Gaming/Main/Core/General/World/VisibilityTracker.cs
      - Altruist/Gaming/Main/Core/2D/World/VisibilityTracker2D.cs
      - Altruist/Gaming/Main/Core/3D/World/VisibilityTracker3D.cs
    types:
      - Altruist.Gaming.IVisibilityTracker
      - Altruist.Gaming.VisibilityChange
      - Altruist.Gaming.ThreeD.VisibilityTracker3D
      - Altruist.Gaming.TwoD.VisibilityTracker2D
    config:
      - altruist:game:visibility
    example: |-
      ```yaml
      altruist:
        game:
          visibility:
            range: 5000        # world units, the default
      ```

      ```csharp
      var player = new PlayerWorldObject(transform) { ClientId = clientId };
      await world.SpawnDynamicObject(player);
      _visibilityTracker.Observe(player);          // explicit: only observers get visibility sets

      _visibilityTracker.OnEntityVisible += change => SendSpawnPacket(change);
      _visibilityTracker.OnEntityInvisible += change => SendDespawnPacket(change);
      ```

  - name: spatial-broadcast
    title: Spatial Broadcast
    summary: >-
      Sends a packet only to the clients that can see an entity, using the visibility sets and the spatial hash grid. It saves bandwidth
      in big worlds, where most clients are far from any one event.
    use:
      - When you replicate an entity's state or event to the players who observe it.
      - When you need a broadcast limited to nearby partitions instead of the whole room.
    avoid:
      - When every connected client must get the message. Use the router's broadcast sender.
      - When you replicate an authoritative match room. Send the game's own snapshots through the rooms package.
    packages:
      - Altruist.Gaming
    docs:
      - /docs/altruist/spatial-broadcast
