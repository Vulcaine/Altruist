capabilities:
  - name: project-creation
    title: Project creation
    summary: >-
      Two ways to start a new Altruist server: the `altruist` dotnet template and the `altruist create` command of the
      Altruist.CLI tool. Both give you the same ready-to-run project with Program.cs, config.yml, one WebSocket portal and one REST controller.
    use:
      - When you start a new Altruist server from nothing and want a project that runs at once.
      - When you want a known-good layout (Program.cs, config.yml, Portals/, Http/) to copy from.
      - When you want a short command to run the current project (`altruist run`, which calls `dotnet run`).
    avoid:
      - When you add Altruist to an existing .NET project, add the packages by hand and write config.yml yourself; see application.
      - When you need a game with rooms, combat or inventory, create the project first, then add those packages (see the gaming capabilities).
    packages:
      - Altruist.CLI
      - Altruist.Templates
    docs:
      - /docs/getting-started/installation
      - /docs/getting-started/quick-start-guide
    paths:
      - CLI/
      - Templates/
    example: |-
      ```bash
      # Option 1: the dotnet template (installs once, then works offline)
      dotnet new install Altruist.Templates
      dotnet new altruist -n MyServer
      cd MyServer
      dotnet run

      # Option 2: the CLI tool (installs the template for you if it is missing)
      dotnet tool install -g Altruist.CLI
      altruist create MyServer
      cd MyServer
      altruist run          # same as: dotnet run
      ```

      The project name must start with a letter and may contain letters, digits, `_` and `.`.
      The template creates `Program.cs` (`await AltruistApplication.Run(args);`), `config.yml`
      (HTTP on 0.0.0.0:8080, a JSON WebSocket at `/ws`, an in-memory cache), `Portals/HelloPortal.cs`
      and `Http/HelloController.cs`. It references the packages Altruist, Altruist.Boot, Altruist.Socket and Altruist.Web.

  - name: configuration
    title: Configuration
    summary: >-
      Altruist is configured from YAML, not from builder code. `config.yml`, then `config.{environment}.yml`, then environment
      variables, then command-line arguments are merged (later wins), and attributes pull the values into your classes.
      The same attributes can also switch whole services on or off.
    use:
      - When a value (port, rate, key, provider) should come from config.yml instead of being hard-coded; use `[AppConfigValue]` on a constructor parameter.
      - When a group of related settings belongs in one typed object; use `[ConfigurationProperties]`.
      - When a value must change while the server runs (tunables); use `ILiveConfigValue<T>`.
      - When a service should exist only if a config key is set, a package is installed, or no other implementation is registered; use `[ConditionalOnConfig]`, `[ConditionalOnAssembly]` or `[ConditionalOnMissingService]`.
      - When you need one instance per entry of a YAML list (for example one per world); use a list-mode `[ConditionalOnConfig(path, KeyField = "id")]` with `*:` paths.
    avoid:
      - When you only need to register a service without any settings, use `[Service]`; see services-and-modules.
      - When a value is a secret, keep it out of the committed YAML and set it by environment variable or `${NAME}` placeholder.
      - When you need the settings of one specific system (email, security, rooms), read that capability's config keys instead of the general mechanics here.
    packages:
      - Altruist
      - Altruist.DI
    docs:
      - /docs/getting-started/configuration
    paths:
      - Altruist/Core/Framework/ConfigurationConverter/
      - Altruist/Core/Framework/Bootstrap/ApplicationConfigs.cs
      - Altruist/DI/Bootstrap/AppConfigLoader.cs
      - Altruist/DI/Bootstrap/AltruistEnvironment.cs
      - Altruist/DI/Bootstrap/ApplicationArgs.cs
      - Altruist/DI/Attributes/ConfigAttributes.cs
      - Altruist/DI/Attributes/ConditionalOnConfig.cs
      - Altruist/DI/Attributes/ConditionalOnMissingService.cs
      - Altruist/DI/Attributes/ConfigurationPropertiesAttribute.cs
    types:
      - Altruist.AltruistConfigOptions
      - Altruist.ServerOptions
      - Altruist.HttpServerOptions
      - Altruist.TransportConfigOptions
      - Altruist.Vector3ConfigConverter
    config:
      - altruist:environment
      - altruist:config
    example: |-
      How the sources combine (later wins):

      1. `config.yml` and `config.{environment}.yml` in the build output folder. The environment is `DOTNET_ENVIRONMENT`,
         else `ASPNETCORE_ENVIRONMENT`, else `Production` (`AltruistEnvironment.Name`), so `config.Development.yml` loads in Development.
      2. Environment variables: the key path upper-cased, `__` for `:` and `_` for `-`.
         `ALTRUIST__SERVER__HTTP__PORT=9090` sets `altruist:server:http:port`. Your own YAML roots work too (`MYAPP__MAIL__API_KEY`).
      3. Command line: `--altruist:server:http:port=9090`.

      A YAML value may read an environment variable: `${NAME}` or `${NAME:-default}`.

      ```yaml
      # config.yml: keys are kebab-case under `altruist:`, your own settings live under your own root
      altruist:
        environment:
          mode: 2D                  # 2D or 3D; the game systems read it
        server:
          http:
            host: 0.0.0.0
            port: ${PORT:-8080}
        game:
          worlds:
            items:                  # a list: one World per item, keyed by id
              - id: overworld
                size: { x: 1000, y: 1000 }
                gravity: { x: 0, y: 0 }

      myapp:
        mail:
          host: smtp.example.com
          port: 587
        match:
          tick-rate: 60
      ```

      ```csharp
      // One value, with a default, converted to the parameter type
      [Service]
      public sealed class Matchmaker
      {
          public Matchmaker(
              [AppConfigValue("myapp:match:size", "4")] int teamSize,
              [AppConfigValue("myapp:match:tick-rate", "30")] ILiveConfigValue<int> tickRate)   // follows reloads
              => tickRate.BindTo(v => _rate = v);                                              // runs now and on every change
          private int _rate;
      }

      // A whole section, bound once at startup and injectable as a singleton
      [ConfigurationProperties("myapp:mail")]
      public sealed class MailSettings
      {
          public string Host { get; set; } = "localhost";
          public int Port { get; set; } = 25;
      }

      // Switch a service on or off
      [Service(typeof(ICache))]
      [ConditionalOnConfig("myapp:cache:provider", havingValue: "redis")]    // only when the key has this value
      [ConditionalOnAssembly("Altruist.Redis")]                              // and only when the package is referenced
      public sealed class RedisCache : ICache { /* ... */ }

      [Service(typeof(IPasswordHasher))]
      [ConditionalOnMissingService(typeof(IPasswordHasher))]                 // framework default; your own [Service] replaces it
      public sealed class DefaultPasswordHasher : IPasswordHasher { /* ... */ }

      // One instance per list item; "*:" paths read from the current item
      [Service(typeof(IWorld))]
      [ConditionalOnConfig("altruist:game:worlds:items", KeyField = "id")]
      public sealed class World : IWorld
      {
          public World([AppConfigValue("*:id")] string id, [AppConfigValue("*:gravity")] Vector2 gravity) { /* ... */ }
      }
      // inject one with [ServiceKey("overworld")] IWorld world, or all with IEnumerable<IWorld> worlds
      ```

  - name: services-and-modules
    title: Services, dependency injection and modules
    summary: >-
      Altruist finds your classes by attribute and wires them into the DI container, so you never write a Startup class.
      `[Service]` registers a class, `[ServiceConfiguration]` runs a step that adds registrations by hand, `[Bean]` registers a factory method,
      and `[AltruistModule]` runs one-time startup code once everything is built.
    use:
      - When you write an ordinary service: mark the class `[Service]` (or `[Service(typeof(IFoo))]` to expose an interface) and take its dependencies in the constructor.
      - When you must call `services.Add...` yourself (third-party libraries, options, auth); use `[ServiceConfiguration(order: n)]` on an `IAltruistConfiguration` class.
      - When you need an object you build by hand (a type you cannot annotate); use a `[Bean]` method.
      - When one-time startup work needs several services together (seeding a registry); use an `[AltruistModule]` static class with an `[AltruistModuleLoader]` method.
      - When a service needs initialization after the container is built, use a `[PostConstruct]` method.
    avoid:
      - When the setting is only a value or a section of YAML, use `[AppConfigValue]` or `[ConfigurationProperties]`; see configuration.
      - When you need a service locator in normal code, inject through the constructor. `Dependencies.Inject<T>()` is for static helpers only.
      - When your process needs no server (a worker or tool), use `AltruistDI.Run(args)` and not the full application; see application.
    packages:
      - Altruist.DI
      - Altruist
    docs:
      - /docs/altruist/di
      - /docs/extension/service
    paths:
      - Altruist/DI/
      - Altruist/Core/Framework/Module/
      - Altruist/Core/Framework/Attributes/
      - Altruist/Core/Framework/Features/
      - Altruist/Core/Framework/ServiceProviderExtensions.cs
      - Altruist/Core/Framework/Contracts/Service.cs
      - Altruist/Core/Framework/Contracts/Strategy.cs
    types:
      - Altruist.AltruistModuleAttribute
      - Altruist.AltruistModuleLoaderAttribute
      - IServiceProviderExtensions
      - Altruist.IService
      - Altruist.IConnectable
      - Altruist.IRelayService
      - Altruist.Contracts.ITransportServiceToken
      - Altruist.Features.IAltruistFeatureProvider
    example: |-
      ```csharp
      // A service, injectable as IScoreService
      [Service(typeof(IScoreService))]
      public sealed class ScoreService : IScoreService
      {
          public ScoreService(ILogger<ScoreService> log, [AppConfigValue("myapp:score:max", "100")] int max) { /* ... */ }

          [PostConstruct]                                   // runs once after the container is built
          public Task InitAsync(IRepository repo) => repo.PreloadAsync();
      }

      // A step that adds registrations by hand; lower order runs first
      [ServiceConfiguration(order: 10)]
      public sealed class MailSetup : IAltruistConfiguration
      {
          private readonly string _host;
          public MailSetup([AppConfigValue("myapp:mail:host", "localhost")] string host) => _host = host;
          public bool IsConfigured { get; set; }
          public Task Configure(IServiceCollection services)
          {
              services.AddSingleton(new SmtpClient(_host));
              return Task.CompletedTask;
          }
      }

      // One-time startup wiring after every service exists, before HTTP starts
      [AltruistModule("Shop")]
      public static class ShopModule
      {
          [AltruistModuleLoader]
          public static async Task Load(ICatalog catalog) => await catalog.SeedAsync();
      }
      ```

  - name: application
    title: Application bootstrap and lifetime
    summary: >-
      `AltruistApplication.Run(args)` is the whole entry point of a server. It loads configuration, registers everything found by attribute,
      builds the container, runs modules, starts HTTP and the transports, and tracks readiness. Built-in health endpoints report the result.
    use:
      - When you write the Program.cs of an Altruist server: one line, `await AltruistApplication.Run(args);`.
      - When another part of the app needs to know whether the server is ready (database and cache connected); inject `IServerStatus`.
      - When a load balancer or Kubernetes probe needs a health check; use `GET /altruist/health` and check the `Online` field.
      - When a service connects to something external and should delay readiness until it is up; implement `IConnectable`.
    avoid:
      - When you need only the DI container, with no HTTP and no transports, use `AltruistDI.Run`; see services-and-modules.
      - When you want to change what the app does, do not edit bootstrap; add services, modules or config instead.
      - When you probe `/altruist/health`, do not trust the status code alone: it is 200 while starting, so read `Online`.
    packages:
      - Altruist
      - Altruist.Boot
    docs:
      - /docs/getting-started/introduction
    paths:
      - Altruist/Boot/
      - Altruist/Core/Framework/Bootstrap/
      - Altruist/Core/Framework/Config/
      - Altruist/Core/Framework/LifeCycle/
      - Altruist/Core/Framework/Health/
      - Altruist/Core/Framework/Logging/
      - Altruist/Core/Framework/Framework.cs
      - Altruist/Core/Framework/Models.cs
      - Altruist/Core/Framework/Contracts/Altruist.cs
    types:
      - Altruist.AltruistApplication
      - Altruist.AltruistBootstrap
      - Altruist.AltruistServerContext
      - Altruist.IAltruistContext
      - Altruist.IServerStatus
      - Altruist.ServerStatus
      - Altruist.ServerInfo
      - Altruist.ServiceHealthController
    config:
      - altruist:logging
    example: |-
      ```csharp
      // Program.cs
      using Altruist;

      await AltruistApplication.Run(args);   // blocks until shutdown; args are the highest-priority config source
      ```

      ```csharp
      // Wait for readiness, and read what the server is
      [Service]
      public sealed class Announcer
      {
          private readonly IServerStatus _status;
          private readonly IAltruistContext _context;
          public Announcer(IServerStatus status, IAltruistContext context) { _status = status; _context = context; }

          public bool CanServe => _status.Status == ReadyState.Alive;    // Starting, Alive or Failed
          public string Address => $"{_context.ServerInfo.Protocol}://{_context.ServerInfo.Host}:{_context.ServerInfo.Port}";
      }
      ```

      ```yaml
      # HTTP is hosted only when host and port are both set
      altruist:
        server:
          http:
            host: 0.0.0.0
            port: 8080
        logging:
          console: true      # false turns the framework console logger off
      ```

      Health: `GET /altruist/health` (readiness) and `GET /altruist/health/details` (endpoints, connection states; restrict it at the network edge).

  - name: server-engine
    title: Server engine and scheduling
    summary: >-
      The engine is the fixed-rate loop of the server: it runs recurring tasks, timers and effects every frame and applies state changes on one thread.
      Here live its contract (`IEngineCore`, `IAltruistEngine`), cron presets and the engine-aware router; the loop itself ships in Altruist.Gaming.
      It is not a web server and not a physics engine.
    use:
      - When game state is changed from a network or request thread and must be applied on the engine thread; use `WaitForNextTick` or `SyncCommit`.
      - When you need a one-shot timer (`ScheduleOnce`), a buff that repeats until it expires (`ScheduleEffect`) or slow I/O whose result the game needs (`RunOffTick`).
      - When work must run on the wall clock (daily reset, pruning); use `RegisterCronJob` with a `CronPresets` expression (UTC).
      - When you serialize work per entity; use `SendTask` with a stable `TaskIdentifier`.
    avoid:
      - When the code is plain request handling with no game loop, do not turn the engine on; leave `altruist:game:engine` out of config.
      - When you want a recurring method, mark it with the `[Cycle]` attribute; see the gaming capabilities.
      - When you want the game tick, world step and physics, see the Gaming Main capabilities; this capability only describes the shared contract.
    packages:
      - Altruist
      - Altruist.Gaming
    docs:
      - /docs/altruist/engine
    paths:
      - Altruist/Core/Framework/Engine/
      - Altruist/Core/Framework/Contracts/Engine.cs
      - Altruist/Core/Framework/Contracts/Cron.cs
    types:
      - Altruist.Engine.IEngineCore
      - Altruist.Engine.IAltruistEngine
      - Altruist.Engine.TaskIdentifier
      - Altruist.Engine.IAltruistEngineRouter
      - Altruist.Engine.EngineRouter
      - CronPresets
      - CronMapper
    example: |-
      ```yaml
      # Presence of this section turns the engine on
      altruist:
        game:
          engine:
            framerateHz: 30      # frames per second; default 30
            diagnostics: false   # true logs how long each task takes
      ```

      ```csharp
      [Service]
      public sealed class Respawner
      {
          private readonly IAltruistEngine _engine;
          public Respawner(IAltruistEngine engine) => _engine = engine;

          // from a network handler: change state on the engine thread
          public void Move(Player p, Vector2 to) => _engine.WaitForNextTick(() => p.Position = to);

          // a one-shot timer
          public void ScheduleRespawn(string playerId) =>
              _engine.ScheduleOnce(TimeSpan.FromSeconds(3), () => Respawn(playerId));

          // wall-clock job (UTC), runs on the thread pool, not the engine thread
          public void ResetDaily() => _engine.RegisterCronJob(DailyReset, CronPresets.Daily);

          private static Task DailyReset() => Task.CompletedTask;
          private void Respawn(string id) { /* ... */ }
      }
      ```

  - name: email
    title: Email
    summary: >-
      Sends transactional email (verification links, password resets) through one interface, `IEmailSender`. A config key picks the provider:
      log it, Resend over HTTP, or any SMTP server.
    use:
      - When your game sends verification or reset emails; inject `IEmailSender` and call `SendAsync`.
      - When you test or develop locally; keep `provider: log` so each email is written to the log instead of sent.
      - When your mail host offers only SMTP (SES, Postmark, Mailgun, a company relay); set `provider: smtp`.
    avoid:
      - When you send mail from a request handler, use `SendInBackground` so the caller never waits on the provider.
      - When you want marketing or bulk mail, use a dedicated mail service; this is for transactional messages.
      - When you hold a secret (API key, SMTP password), put it in an environment variable, not in a committed YAML file.
    packages:
      - Altruist
    docs:
      - /docs/altruist/email
    paths:
      - Altruist/Core/Framework/Email/
    types:
      - Altruist.Email.IEmailSender
      - Altruist.Email.EmailMessage
      - Altruist.Email.EmailOptions
      - Altruist.Email.ConfiguredEmailSender
      - Altruist.Email.SmtpEmailSender
      - Altruist.Email.SmtpOptions
      - Altruist.Email.EmailSenderExtensions
    config:
      - altruist:email
    example: |-
      ```yaml
      altruist:
        email:
          provider: smtp              # log (default) | resend | smtp
          from: "Game <no-reply@example.com>"
          # resend-api-key: ${RESEND_API_KEY}    # for provider: resend
          smtp:
            host: ${SMTP_HOST}
            port: ${SMTP_PORT:-587}
            username: ${SMTP_USER}
            password: ${SMTP_PASS}
            security: starttls        # starttls (default) | ssl | none (Development only)
            timeout-seconds: 30
      ```

      ```csharp
      [Service]
      public sealed class Mailer
      {
          private readonly IEmailSender _email;
          private readonly ILogger<Mailer> _log;
          public Mailer(IEmailSender email, ILogger<Mailer> log) { _email = email; _log = log; }

          public Task SendVerificationAsync(string to, string link) =>
              _email.SendInBackground(                                  // returns at once; failures are logged as warnings
                  new EmailMessage(to, "Verify your email", $"<a href=\"{link}\">Verify</a>", $"Verify: {link}"), _log);
      }
      ```

  - name: core-utilities
    title: Core utilities
    summary: >-
      Small helpers used across the framework and open to your code: a thread-safe pool for scratch collections, route and reflection helpers,
      and flag-enum helpers that do not mutate.
    use:
      - When a hot path (per tick, per packet) needs a temporary list, dictionary, set or StringBuilder; rent it from `AltruistPool` and return it in the same scope.
      - When you test, set or clear bits of a `[Flags]` enum without casting; use `FlagExtensions` (`IsSet`, `SetFlag`, `UnsetFlag`).
      - When you build a route from segments without double slashes; use `PathUtils.NormalizeRoute`.
    avoid:
      - When a collection is stored long-term, allocate it normally; pooling is only for short-lived scratch objects.
      - When you need pooled arrays, use `System.Buffers.ArrayPool<T>`.
    packages:
      - Altruist
    docs: []
    paths:
      - Altruist/Core/Framework/Pool/
      - Altruist/Core/Framework/Util/
      - Altruist/Core/Framework/Flags/
    types:
      - Altruist.AltruistPool
      - Altruist.FlagExtensions
      - Altruist.PathUtils
      - Altruist.ReflectionUtils
    example: |-
      ```csharp
      var ids = AltruistPool.RentList<int>();
      try
      {
          Collect(ids);                       // fill it
          Process(ids);
      }
      finally
      {
          AltruistPool.ReturnList(ids);       // cleared on return; never use it afterwards
      }

      var perms = Perm.Read.SetFlag(Perm.Write);   // Read | Write, returns a new value
      bool canWrite = perms.IsSet(Perm.Write);     // true
      ```

  - name: testing
    title: Testing
    summary: >-
      xUnit helpers that run your tests against the real Altruist container. `[AltruistTest]` builds a fresh DI container per test with mocks,
      `[AltruistIntegrationTest]` boots a real server for network tests, and `[AltruistE2ETest]` drives the client stack against a running server.
    use:
      - When you test a service with its real dependencies and want some replaced by mocks; use `[AltruistTest]` and `[Mock]` constructor parameters.
      - When you test TCP, UDP, WebSocket or HTTP round trips against a live server; use `[AltruistIntegrationTest]` with `TestTcpClient`, `TestWebSocketClient` and the like.
      - When you test the full client stack against a server that already runs (docker, staging) or from a host without xUnit; use `[AltruistE2ETest]` and `AltruistTestRunner`.
    avoid:
      - When a plain unit test needs no container, write a normal xUnit test.
      - When a test only checks business logic, prefer `[AltruistTest]`; it is faster and isolated per test than `[AltruistIntegrationTest]`.
      - When the E2E server is production, do not; run a dedicated stack with its own database and `altruist:e2e:enabled: true`.
    packages:
      - Altruist.Testing
      - Altruist.Testing.E2E.Core
    docs: []
    paths:
      - Altruist/Testing/
      - Altruist/Testing.E2E.Core/
    types:
      - Altruist.Testing.AltruistTestFramework
      - Altruist.Testing.AltruistTestRuntime
      - Altruist.Testing.TestPlayerSession
      - Altruist.Testing.TestHttpClient
      - Altruist.Testing.TestTcpClient
      - Altruist.Testing.E2E.AltruistE2EFixture
      - Altruist.Testing.E2E.AltruistTestRunner
    config:
      - altruist:e2e
    example: |-
      ```csharp
      // once per test assembly
      [assembly: Xunit.TestFramework("Altruist.Testing.AltruistTestFramework", "Altruist.Testing")]

      // service test: fresh container per [Fact]; the mocked IClock is what IScoreService receives
      [AltruistTest(RunModuleLoaders = false)]
      public sealed class ScoreServiceTests
      {
          private readonly IScoreService _scores;
          public ScoreServiceTests(IScoreService scores, [Mock] IClock clock) => _scores = scores;

          [Fact]
          public async Task Adds_points() => Assert.Equal(10, await _scores.AddAsync("p1", 10));
      }

      // network test against a server the framework boots for you
      [AltruistIntegrationTest]
      public sealed class EchoTests
      {
          private readonly TestTcpClient _tcp;
          public EchoTests(TestTcpClient tcp) => _tcp = tcp;

          [Fact]
          public async Task Echoes()
          {
              await _tcp.ConnectAsync();
              await _tcp.SendAsync("echo", new { text = "hi" });
              Assert.NotEmpty(await _tcp.DrainAsync(TimeSpan.FromSeconds(1)));
          }
      }
      ```

      ```yaml
      # config.E2E.yml on the server an [AltruistE2ETest] runs against
      altruist:
        e2e:
          enabled: true     # without it the fixture's reset endpoint answers 404
      ```

  - name: transports
    title: Transports and connections
    summary: >-
      The listeners that accept client connections: TCP, UDP and WebSocket, plus the connection manager that tracks every live connection. You turn each transport on in config.yml and any mix can run at once. Portal code stays the same on all of them.
    use:
      - When you need a browser client (WebSocket), a reliable desktop or mobile stream (TCP) or fast unreliable updates (UDP).
      - When you need to cap connections, set the idle timeout or change a port.
      - When you write a new kind of transport (implement ITransport) or need to look up or close a connection by id.
    avoid:
      - When you need to handle what clients send, use portals-and-routing instead. Transports only deliver bytes.
      - When you need to choose the message format (JSON or MessagePack), use packets-and-codecs instead.
      - When you need REST endpoints, use http-api instead.
    packages:
      - Altruist
      - Altruist.Socket
      - Altruist.Web
    docs:
      - /docs/networking/server-setup
      - /docs/networking/tcp
      - /docs/networking/udp
      - /docs/networking/websocket
      - /docs/deployment/multi-channel
    paths:
      - Altruist/Socket/
      - Altruist/Web/
      - Altruist/Core/Framework/Networking/Transport.cs
      - Altruist/Core/Framework/Networking/ConnectionManager/
      - Altruist/Core/Framework/Networking/SocketManager/
      - Altruist/Core/Framework/Contracts/Connection.cs
    types:
      - Altruist.Transport.ITransport
      - Altruist.ConnectionManager
      - Altruist.IConnectionManager
      - Altruist.ISocketManager
      - Altruist.Socket.TcpTransport
      - Altruist.Socket.UdpTransport
      - Altruist.Web.WebSocketTransport
      - Altruist.Socket.IConnectionGate
    config:
      - altruist:server:transport
    example: |-
      ```yaml
      # config.yml: run WebSocket for browsers and TCP + UDP for desktop clients
      altruist:
        server:
          transport:
            max-connections: 2000
            websocket:
              enabled: true
            tcp:
              enabled: true
              port: 13000
            udp:
              enabled: true
              port: 13001
      ```

      ```csharp
      // Program.cs: nothing else is needed, the enabled transports start with the app
      using Altruist;
      await AltruistApplication.Run(args);
      ```

  - name: portals-and-routing
    title: Portals, gates and routing
    summary: >-
      A portal is a class that handles client messages. Each gate method on it handles one event name, and the router sends replies to one client, a room or everyone. Interceptors can inspect or drop packets before a gate runs, and an outbound queue can send without blocking your handler.
    use:
      - When you handle client messages: mark a class with [Portal("/path")] and add [Gate("event")] methods.
      - When you send a packet to one client, a room or all clients with IAltruistRouter.
      - When you need to react to a client connecting or disconnecting (OnConnectedAsync, OnDisconnectedAsync).
      - When you filter or log every incoming packet with an IInterceptor, or send through the queued outbound mode for busy game loops.
    avoid:
      - When you need to limit how fast a client may send, use rate-limit instead. It is built on interceptors.
      - When you only need to send entity changes (changed properties), use entity-sync instead.
      - When you serve plain request and response over HTTP, use http-api instead.
    packages:
      - Altruist
    docs:
      - /docs/networking/portals
      - /docs/networking/router
    paths:
      - Altruist/Core/Framework/Portal/
      - Altruist/Core/Framework/PortalRegistry.cs
      - Altruist/Core/Framework/Contracts/Portal.cs
      - Altruist/Core/Framework/Contracts/Router.cs
      - Altruist/Core/Framework/Networking/Interceptor.cs
      - Altruist/Core/Framework/Networking/Outbound.cs
      - Altruist/Core/Framework/Networking/PacketContext.cs
      - Altruist/Core/Framework/Networking/Endpoints.cs
      - Altruist/Core/Framework/Networking/Relay/
    types:
      - Altruist.Portal
