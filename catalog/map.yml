  - name: navmesh
    title: Navigation Mesh and Pathfinding
    summary: >-
      Builds a navigation mesh from a walkability grid and terrain, finds paths on it (A* plus funnel smoothing), and moves agents along
      those paths. NavMeshService holds one mesh per zone name. NavMeshRuntime ticks body-bound agents.
    use:
      - When NPCs or monsters must walk to a target around obstacles in a 3D world.
      - When you need a reachability check, a random point on the mesh, or a line-of-walk test inside a zone.
      - When you have a raw navmesh JSON (vertices and indices) to load.
    avoid:
      - When movement is grid-based and a walkability check per step is enough. Use [walkability-grid].
      - When you need a player-controlled character with slopes and jumping. Use [character-movement].
    packages:
      - Altruist.Gaming
    docs: []
    paths:
      - Altruist/Gaming/Main/Core/3D/World/Navmesh/
    types:
      - Altruist.Gaming.ThreeD.INavMeshService
      - Altruist.Gaming.ThreeD.INavMeshRuntime
      - Altruist.Gaming.ThreeD.NavMeshBuilder
      - Altruist.Gaming.ThreeD.NavMeshAgent
      - Altruist.Gaming.ThreeD.NavMeshGraph
      - Altruist.Gaming.ThreeD.NavPath
      - Altruist.Gaming.ThreeD.NavMeshLoader
      - Altruist.Gaming.ThreeD.NavMeshSchema
    example: |-
      ```csharp
      [Service]
      public class Patrol(INavMeshService navMesh, INavMeshRuntime runtime)
      {
          public void Setup(IWalkabilityGrid grid, ITerrainProvider terrain, IPhysxBody3D body)
          {
              var graph = NavMeshBuilder.Build(grid, terrain);          // null when nothing is walkable
              if (graph != null) navMesh.RegisterMesh("forest_01", graph);

              var agent = runtime.CreateAgent("forest_01", body, speed: 3.5f);
              agent.SetDestination(from: body.Position, to: new Vector3(40, 0, 25));
          }

          // Call once per world step; nothing calls it for you.
          public void Step(float dt) => runtime.Update(dt);
      }
      ```

  - name: terrain
    title: Terrain, Heightmaps and Spatial Queries
    summary: >-
      Answers "what is under or in front of this body?" for the character controller. With physics on, queries go to the BEPU engine.
      With physics off, a heightmap provider uses your ITerrainProvider (walkability, height, normal) plus the entity colliders.
      Also loads heightmap images (PNG, JPEG, TIFF, raw) into BEPU heightfields.
