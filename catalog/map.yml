      ```csharp
      // Not available as a package. For another database, implement the provider contract:
      [Service(typeof(IGeneralDatabaseProvider))]
      public class MyDbProvider : IGeneralDatabaseProvider { /* see /docs/extension/database */ }
      ```

  - name: autosave
    title: Autosave
    summary: >-
      Batched, cache-first saving for vault models. You mark an object dirty and Altruist flushes dirty objects to the
      database on an interval, in batches, with a write-ahead log for crash recovery. It cuts thousands of single
      writes into a few batched ones.
    use:
      - When many players or entities change often (position, gold, stats) and writing each change would overload the database.
      - When a crash should lose at most a few seconds of changes (the write-ahead log is on by default).
    avoid:
      - When a change must be in the database before you continue (a trade, a purchase), call SaveAsync on the autosave service (cache and database now) or use a vault transaction.
      - When you only create new rows or run queries, use vault directly.
    packages:
      - Altruist.Gaming.Autosave
    docs:
      - /docs/altruist/persistence/autosave
    paths:
      - Altruist/Gaming/Autosave/
    types:
      - Altruist.Gaming.Autosave.AutosaveAttribute
      - Altruist.Gaming.Autosave.IAutosaveService<T>
      - Altruist.Gaming.Autosave.AutosaveCycle
      - Altruist.Gaming.Autosave.IAutosaveCoordinator
      - Altruist.Gaming.Autosave.WriteAheadLog<T>
    config:
      - altruist:game:autosave
    example: |-
      The interval and batch size come from the attribute first, then from config, then from the built-in defaults
      (every 5 minutes, batch 100). `Wal = false` turns the write-ahead log off for low-value, high-frequency data.
      ```yaml
      altruist:
        game:
          autosave:
            default-interval: "*/1 * * * *"
            default-batch-size: 200
            wal:
              enabled: true
              directory: data/wal
              flush-interval-seconds: 1
      ```
      ```csharp
      [Autosave(120, AutosaveCycle.Seconds, BatchSize = 200)]
      [Vault("players")]
      public class PlayerVault : VaultModel { /* columns */ }

      [Service]
      public class CharacterService(IAutosaveService<PlayerVault> autosave)
      {
          public Task<PlayerVault?> JoinAsync(string id) => autosave.LoadAsync(id);   // cache first
          public void Move(PlayerVault p, int x) { p.X = x; autosave.MarkDirty(p); }    // no database hit now
          public Task TradeAsync(PlayerVault p) => autosave.SaveAsync(p);               // cache and database now
      }
      ```

  - name: fleet-and-server-nodes
    title: Fleet, Capacity and Drain
    summary: >-
      Runs one game on many servers. Every server is a node with a capacity budget, a drain (stop taking new work, let
      running work finish, then exit), health endpoints, and a heartbeat into a shared backplane. A fleet registry, a
      relay (?node=) and shared counters let a client reach the right server and let limits hold across servers.
    use:
      - When you run more than one copy of the server (Docker, Kubernetes) and rooms, lobbies or queues must find each other.
      - When you need a load budget (max-load), readiness and liveness probes, or a graceful scale-down on SIGTERM.
      - When tickets, rate limits or lockouts must be counted once for the whole fleet (shared counters in the backplane).
    avoid:
      - When you only need independent shards that never talk to each other, use multi-channel servers.
      - When one server is enough: leave the defaults. With the in-memory backplane the fleet code stays inert.
      - When you want to store game data, use persistence. The backplane holds only control-plane state.
    packages:
      - Altruist
      - Altruist.Redis
    docs:
      - /docs/deployment/fleet
      - /docs/deployment/server-node
      - /docs/deployment/benchmarks
    paths:
      - Altruist/Core/Framework/Scaling/
      - Altruist/Redis/Core/RedisFleetBackplane.cs
    types:
      - Altruist.IServerNode
      - Altruist.ServerNode
      - Altruist.ICapacityContributor
      - Altruist.IDrainParticipant
      - Altruist.IFleet
      - Altruist.IFleetBackplane
      - Altruist.Redis.RedisFleetBackplane
      - Altruist.FleetRelayMiddleware
    config:
      - altruist:server:capacity
      - altruist:server:drain
      - altruist:server:fleet
      - altruist:fleet
    example: |-
      Safe by default: the relay signs forwarded client IP headers with HMAC and ignores unsigned ones. The signing key
      is `fleet:secret`, and falls back to `altruist:security:key`, so set one of them to a real secret in production.
      The drain endpoint answers loopback callers; from outside it needs the `X-Altruist-Drain-Token` header, so set
      `drain:token` only if you must call it remotely. The default backplane is in memory; set `fleet:redis` to share it.
      Keep your orchestrator's grace period above `drain:timeout + force-grace`.
      ```yaml
      altruist:
        server:
          http: { host: "0.0.0.0", port: 8080 }
          capacity:
            max-load: 200          # 0 = unlimited
          drain:
            timeout: 360           # seconds running work may take
            force-grace: 5
            on-shutdown: true
            token: ""              # optional, for POST /altruist/server/drain from outside loopback
          fleet:
            redis: "redis:6379"    # shared backplane (default: in memory)
            cluster: my-game       # servers with the same name form one fleet
            heartbeat: 2           # seconds
            secret: ""             # relay signature key, default altruist:security:key
      ```
      ```csharp
      [Service(typeof(ICapacityContributor))]
      public sealed class MyRoomsCapacity : ICapacityContributor
      {
          public string Kind => "rooms";
          public CapacitySample Sample() => /* units and load of what this server runs */;
      }

      public sealed class Stats(IFleet fleet, IServerNode node)
      {
          public string Describe() =>
              $"{node.Capacity().State}: " + string.Join(", ", fleet.Nodes.Select(n => $"{n.NodeId} {n.Load}/{n.MaxLoad}"));
      }
      ```

  - name: game-engine
    title: Game Engine and Fixed-Step Loop
    summary: >-
      The server-side game loop. It runs your [Cycle] methods, timers and effects at a steady frame rate, and steps every
      registered world once per frame. A fixed-rate stepper gets whole steps of exactly 1/Hz seconds, so a simulation
      gives the same result however the frames fall. It is created only when the altruist:game:engine section exists.
    use:
      - When game logic must run at a steady rate (30 or 120 Hz) whatever the clients do.
      - When you want a [Cycle] method, a delayed effect or a cron job on the game loop.
      - When you need an authoritative simulation that steps at a fixed rate (for example a 60 Hz match) through IWorldStepper.
      - When a socket handler must hand work to the loop (WaitForNextTick, SyncCommit) instead of locking shared state.
    avoid:
      - When a [Cycle] method awaits something, do not declare it async void; the server refuses it at start. Return Task so the engine awaits it and reports its failures.
      - When you only need a periodic background job with no game state, and no game engine is configured. Use a plain hosted service.
      - When you need deterministic tick logic that the TypeScript client also runs. Write that logic with [flow] and call it from a stepper.
    packages:
      - Altruist.Gaming
    docs:
      - /docs/altruist/engine
    paths:
      - Altruist/Gaming/Main/Core/General/Engine/
      - Altruist/Gaming/Main/Core/General/Config/
      - Altruist/Gaming/Main/Core/General/World/FixedStepClock.cs
      - Altruist/Gaming/Main/Core/General/World/StepScheduler.cs
      - Altruist/Core/Framework/Regen/
      - Altruist/Gaming/Regen/
    types:
      - Altruist.Engine.AltruistEngine
      - Altruist.Engine.IEffectManager
      - Altruist.Engine.EngineTestDriver
      - Altruist.Engine.ManualEngineClock
      - Altruist.Gaming.IStepScheduler
      - Altruist.Gaming.OverrunPolicy
      - CycleRate
      - CycleUnit
      - CycleAttribute
      - Altruist.EngineConfigOptions
    config:
      - altruist:game:engine
      - altruist:game
    example: |-
      ```yaml
      altruist:
        game:
          engine:
            framerateHz: 120          # sampling rate of the loop
            world-step: inline        # worker (default) or inline
            fixed-step:
              max-steps-per-frame: 8
              overrun: drop           # drop | carry | slow-motion
      ```

      ```csharp
      using Altruist.Gaming;

      // A 60 Hz simulation that the engine steps. Every FixedStep is exactly step.Dt long.
      [Service]
      [Service(typeof(IWorldStepper))]
      public class MatchSimulation : IWorldStepper
      {
          public StepMode Mode => StepMode.Fixed;
          public int FixedHz => 60;

          public void BeforeSteps(in FrameInfo frame) { }
          public void FixedStep(in FixedStep step) => Advance(step.Dt);
          public void AfterSteps(in FrameInfo frame) { }
      }

      // A method on the game loop, 10 times per second.
      [Cycle(10, CycleUnit.Hz)]
      public void Housekeeping() { }
      ```

  - name: worlds
    title: Game Worlds and the World Coordinator
    summary: >-
      A world is a spatial container for game objects. It owns the physics world, the partitions, spawning and spatial queries.
      This capability holds the dimension-neutral parts: the world index from config, the WorldCoordinator that steps every
      world once per frame, the world object contracts, and the PlayerEntity base. The 2D and 3D parts are in worlds-2d and worlds-3d.
    use:
      - When you declare one or more worlds in config.yml (size, gravity, partition size, optional JSON data file).
      - When you spawn and look up world objects through IGameWorldOrganizer and IWorldObject.
      - When you want one large world with many maps, each a zone, or several separate worlds.
    avoid:
      - When you need a physics world that you own and step yourself, with no organizer, entities or visibility. Use [physics-2d].
      - When your game is rooms and matches rather than a persistent spatial world. Use the rooms package.
