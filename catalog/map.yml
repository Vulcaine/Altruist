  - name: combat
    title: Combat
    summary: >-
      A small combat core: one attacker hits one target, or sweeps an area (sphere, cone, line) in 2D or 3D. A damage calculator you replace turns attacker and target into damage, and hit, death and sweep events tell your game what happened. Your game keeps the formulas, rewards and packets.
    use:
      - When entities in your world hit each other and you want health, kill and event handling done for you.
      - When you need area attacks (cones, spheres, lines) with a target cap and a filter.
      - When clients send attack and target packets and you want the built-in portal gates for them.
      - When attacks must be checked against where targets were on the attacker's screen (it uses lag compensation when the packet carries a client tick).
    avoid:
      - When you need knockback, impulses or projectiles that move bodies. Use the physics and body APIs of the gaming package; this only moves health numbers.
      - When your fights are turn-based inside a match room. Put the rules in your room simulation (see rooms) and skip this service.
    packages:
      - Altruist.Gaming.Combat
    docs:
      - /docs/gaming/combat
      - /docs/extension/damage-calculator
    paths:
      - Altruist/Gaming/Combat/
    types:
      - Altruist.Gaming.Combat.ICombatService
      - Altruist.Gaming.Combat.CombatService
      - Altruist.Gaming.Combat.ICombatEntity
      - Altruist.Gaming.Combat.IDamageCalculator
      - Altruist.Gaming.Combat.DefaultDamageCalculator
      - Altruist.Gaming.Combat.DamageSpec
      - Altruist.Gaming.Combat.SweepQuery3D
      - Altruist.Gaming.Combat.AltruistCombatPortal
    example: |-
      ```csharp
      // 1. Your entity says how to read and change health.
      [WorldObject("player")]
      public sealed class PlayerEntity : WorldObject3D, ICombatEntity
      {
          public int Hp { get; set; }
          public int MaxHp { get; set; }
          public int Attack { get; set; }
          public int Defense { get; set; }
          public uint VirtualId { get; set; }

          int ICombatEntity.Health { get => Hp; set => Hp = value; }
          int ICombatEntity.MaxHealth => MaxHp;
          bool ICombatEntity.IsDead => Hp <= 0;
          float ICombatEntity.X => Transform.Position.X;
          float ICombatEntity.Y => Transform.Position.Y;
          float ICombatEntity.Z => Transform.Position.Z;
          public int GetAttackPower() => Attack;
          public int GetDefensePower() => Defense;

          public PlayerEntity(Transform3D transform) : base(transform) { }
      }

      // 2. Replace the default formula (max(1, attack - defense)).
      [Service(typeof(IDamageCalculator))]
      public sealed class GameDamageCalculator : IDamageCalculator
      {
          public DamageSpec Calculate(ICombatEntity attacker, ICombatEntity target)
          {
              bool crit = Random.Shared.NextDouble() < 0.15;
              int damage = Math.Max(1, attacker.GetAttackPower() - target.GetDefensePower());
              return new DamageSpec(crit ? (int)(damage * 1.5f) : damage, crit ? DamageFlags.Critical : DamageFlags.Normal);
          }
      }

      // 3. Attack, sweep, and react.
      HitResult hit = _combat.Attack(attacker, target);
      var cone = SweepQuery3D.Cone(attackerPos, attackerYaw, range: 3f, halfAngleRadians: MathF.PI / 4) with { MaxTargets = 5 };
      _combat.Sweep(attacker, cone, damage: 25);

      [CombatHandler]
      public sealed class PlayerCombatHandlers
      {
          [CombatEvent(typeof(HitEvent))]
          public void OnHit(HitEvent hit, PlayerEntity attacker, PlayerEntity target) { /* play effects */ }
      }
      ```

  - name: inventory
    title: Inventory
    summary: >-
      Items, containers and equipment for a game: grid inventories (Diablo style), slot inventories (WoW style), named equipment slots and ground items. Item types and templates are yours; the framework handles placement, stacking, moves and the client packets. The client package keeps a mirror of the server inventory in a .NET game client.
    use:
      - When players carry, stack, move, equip, drop and pick up items, and the server must be the authority.
      - When you want data-driven items: templates loaded from JSON or a database, with your own fields.
      - When a .NET game client (Unity, Godot, console) needs a local mirror of the player's inventory that updates from server packets (Altruist.Client.Inventory).
    avoid:
      - When you only store a few numbers on a player (gold, level). Keep those in your own vault model and skip containers.
      - When the client is a browser. Altruist.Client.Inventory is for .NET clients; handle the inventory packets yourself with the typescript-client packages.
    packages:
      - Altruist.Gaming.Inventory
      - Altruist.Client.Inventory
    docs:
      - /docs/gaming/inventory
    paths:
      - Altruist/Gaming/Inventory/
      - Altruist/Client/Inventory/
    types:
      - Altruist.Gaming.Inventory.IInventoryService
      - Altruist.Gaming.Inventory.InventoryService
      - Altruist.Gaming.Inventory.GameItem
      - Altruist.Gaming.Inventory.ItemTemplate
      - Altruist.Gaming.Inventory.IItemTemplateProvider
      - Altruist.Gaming.Inventory.ContainerConfig
      - Altruist.Gaming.Inventory.SlotKey
      - Altruist.Gaming.Inventory.AltruistInventoryPortal
      - Altruist.Client.Inventory.IClientInventoryService
    example: |-
      ```csharp
      // Register templates once at startup.
      [Service]
      public class ItemSetup
      {
          private readonly IItemTemplateProvider _templates;
          public ItemSetup(IItemTemplateProvider templates) => _templates = templates;

          [PostConstruct]
          public void RegisterItems() => _templates.LoadFromJson<WeaponTemplate>("Resources/weapons.json");
      }

      // Give a player containers, then items.
      [Service]
      public class PlayerInventorySetup
      {
          private readonly IInventoryService _inventory;
          public PlayerInventorySetup(IInventoryService inventory) => _inventory = inventory;

          public void SetupPlayer(string playerId)
          {
              _inventory.CreateContainer(playerId, new ContainerConfig
              {
                  ContainerId = "inventory", ContainerType = ContainerType.Grid, Width = 10, Height = 6,
              });
              _inventory.CreateContainer(playerId, new ContainerConfig
              {
                  ContainerId = "bank", ContainerType = ContainerType.Slot, SlotCount = 100,
              });

              GameItem sword = _inventory.CreateItem(templateId: 1001);
              ItemStatus status = _inventory.AddItem(playerId, "inventory", sword);   // auto-placed
          }
      }
      ```

  - name: questing
    title: Questing
    summary: >-
      A quest runtime. Quests are classes with attributes for id, name and requirements, and state methods that react to events such as kill, NPC talk, item pickup or timer. The runtime checks requirements, runs your hooks, saves progress and tells your game what changed. Your game owns the packets and the UI.
    use:
      - When your game has quests with steps, counters and requirements (level, class, faction).
      - When quest progress must survive relogs and level changes (reconcile and suspend, without deleting progress).
      - When you want quests as plain C# classes found by scanning an assembly.
    avoid:
      - When you only need a generic state machine for AI or entities. Use the state machine feature of the gaming package; quests add persistence, requirements and update publishing on top.
      - When you want a ready-made quest UI or quest packets. The package sends nothing to clients; you map QuestUpdate to your own packet.
    packages:
      - Altruist.Gaming.Questing
    docs:
      - /docs/gaming/quest-system
    paths:
      - Altruist/Gaming/Questing/
    types:
      - Altruist.Gaming.Questing.QuestRuntime<TContext>
      - Altruist.Gaming.Questing.QuestBehavior<TContext>
      - Altruist.Gaming.Questing.QuestContext
      - Altruist.Gaming.Questing.QuestTrigger
      - Altruist.Gaming.Questing.IQuestStateStore
      - Altruist.Gaming.Questing.IQuestUpdateSink<TContext>
      - Altruist.Gaming.Questing.IQuestRequirementEvaluator<TContext>
      - Altruist.Gaming.Questing.QuestUpdate
    example: |-
      ```csharp
      // A quest is a class. The runtime finds it by scanning the assembly.
      [Quest("side.gather_ores")]
      [QuestName("Gather Ores")]
      [QuestRequirement("level", QuestOperator.GreaterOrEqual, 10)]
      public sealed class GatherOresQuest : QuestBehavior<GameQuestContext>
      {
          [QuestState("talk_to_blacksmith", Initial = true)]
          public string? TalkToBlacksmith(GameQuestContext ctx)
              => ctx.Trigger == QuestTrigger.Npc && ctx.TargetId == BlacksmithNpcId ? "collect_ore" : null;

          [QuestStateEnter("collect_ore")]
          public void EnterCollectOre(GameQuestContext ctx)
          {
              ctx.State.Set("target", 10);
              ctx.State.Set("count", 0);
          }

          [QuestState("collect_ore")]
          public string? CollectOre(GameQuestContext ctx)
          {
              if (ctx.Trigger == QuestTrigger.Item && ctx.TargetId == IronOreItemId
                  && ctx.State.Increment("count") >= ctx.State.Get("target", 10))
                  return "completed";
              return null;
          }
      }

      // Host side: you supply the store, the sink (QuestUpdate -> your packet) and requirement evaluators.
      var runtime = new QuestRuntime<GameQuestContext>(stateStore, updateSink, requirements, contextFactory);
      runtime.LoadFromAssembly(typeof(GatherOresQuest).Assembly);
      await runtime.FireAsync(baseContext, QuestTrigger.Item, targetId: IronOreItemId);
      ```

  - name: rooms
    title: Match Rooms
    summary: >-
      A host for short-lived, authoritative match rooms: a fixed group of players in an isolated instance with its own fixed-step simulation. It handles connections, seats for players and bots, ordered input, snapshots, reconnect, bot refill and room disposal. You write the simulation and the packets. Rooms are a library type, not a [Service]: you build a RoomHost yourself and expose it to the engine.
    use:
      - When your game is session-based (matches, rounds, races, arenas) and each match is its own deterministic simulation.
      - When you need reconnect grace, bots filling empty seats, team forfeits and clean room disposal.
      - When clients predict their own input and the server must apply exactly the client's input stream (see typescript-client).
    avoid:
      - When players share one persistent open world. Use the world organizers (2D or 3D) of the gaming package instead.
      - When you only need to group players and then start a room. Rooms alone do not queue anyone; add matchmaking (public queues) or lobbies (private invite codes).
    packages:
      - Altruist.Gaming.Rooms
    docs:
      - /docs/gaming/rooms
    paths:
      - Altruist/Gaming/Rooms/
    types:
      - Altruist.Gaming.Rooms.RoomHost<TSim, TInput, TPlayer>
      - Altruist.Gaming.Rooms.IRoomGame<TSim, TInput, TPlayer>
      - Altruist.Gaming.Rooms.IRoomSimulation<TInput>
      - Altruist.Gaming.Rooms.IRoomTransport
      - Altruist.Gaming.Rooms.IRoomHostModule<TSim, TInput, TPlayer>
      - Altruist.Gaming.Rooms.RoomHostOptions
      - Altruist.Gaming.Rooms.RoomRules
      - Altruist.Gaming.Rooms.RoomInputModel<TInput>
    example: |-
      ```csharp
      // How you turn it on: there is no config key. Reference Altruist.Gaming.Rooms, build the host in
      // a service of your own, and forward the engine's fixed steps to it.
      // Your game implements IRoomGame<ArenaSim, PadInput, Profile> (simulation, bots, packets).
      [Service(typeof(IWorldStepper))]
      public sealed class ArenaServer : IWorldStepper
      {
          private readonly RoomHost<ArenaSim, PadInput, Profile> _host;

          public ArenaServer(IServerNode node, IFleet fleet, IStepScheduler scheduler)
          {
              var game = new ArenaGame();
              _host = new RoomHost<ArenaSim, PadInput, Profile>(game, new ArenaTransport(), new RoomHostOptions(), fixedHz: 60)
                  .UseScheduler(scheduler).UseServer(node).UseFleet(fleet);
          }

          public StepMode Mode => StepMode.Fixed;
          public int FixedHz => _host.FixedHz;
          public void BeforeSteps(in FrameInfo f) => _host.BeforeSteps(f);
          public void FixedStep(in FixedStep s) => _host.FixedStep(s);
          public void AfterSteps(in FrameInfo f) => _host.AfterSteps(f);
      }

      // Socket handlers run on socket threads: hand the call to the engine thread.
      // _engine.WaitForNextTick(() => _host.SubmitInput(clientId, packet.Seq, input));
      ```

      ```yaml
      # The host must run on the engine thread.
      altruist:
        game:
          engine:
            framerateHz: 60
            world-step: inline
      ```

  - name: matchmaking
    title: Matchmaking
    summary: >-
      Public queues for match rooms. Waiting players are grouped by playlist (and rating), bots fill unrated rooms, and queued players can join running rooms (join in progress). It is a module you add to a RoomHost, not a [Service]; there is no config key and the options are passed in code.
    use:
      - When strangers queue for a mode (duel, 2v2, ranked) and you want them put into rooms automatically.
      - When you want rating windows, bot backfill or join in progress to replace leavers.
      - When you run a fleet and want players of one playlist to gather on one server.
    avoid:
      - When friends play together through an invite code and a leader picks the mode. Use lobbies instead.
      - When you have no match rooms. Matchmaking needs a RoomHost; see rooms.
      - When you only need the queue logic in a tool or a test without a host. Use Matchmaker alone.
    packages:
      - Altruist.Gaming.Matchmaking
    docs:
      - /docs/gaming/matchmaking
      - /docs/client-sdk/matchmaking
    paths:
      - Altruist/Gaming/Matchmaking/
    types:
      - Altruist.Gaming.Matchmaking.MatchmakingModule<TSim, TInput, TPlayer>
      - Altruist.Gaming.Matchmaking.IMatchmakingGame<TSim, TInput, TPlayer>
      - Altruist.Gaming.Matchmaking.MatchmakingOptions
      - Altruist.Gaming.Matchmaking.PlaylistOptions
      - Altruist.Gaming.Matchmaking.Matchmaker
      - Altruist.Gaming.Matchmaking.QueueStatusInfo
    example: |-
      ```csharp
      // How you turn it on: create the module and add it to your RoomHost. Your game class
      // implements IMatchmakingGame<ArenaSim, PadInput, Profile> next to IRoomGame.
      var playlists = new[]
      {
          new PlaylistOptions { Id = "duel", Mode = "1v1", TeamSize = 1, Rules = new RoomRules { JoinInProgress = true } },
          new PlaylistOptions { Id = "ranked", Mode = "2v2", TeamSize = 2, Rated = true },
      };
      var mm = new MatchmakingModule<ArenaSim, PadInput, Profile>(game, new MatchmakingOptions { FillAfterSeconds = 10 }, playlists);
      host.Use(mm);

      // On the engine thread, when a client asks to queue or cancels:
      if (mm.Queue.Playlist(request.Playlist) is { } playlist) mm.Enqueue(session, playlist);
      mm.Cancel(session);
      ```

  - name: lobbies
    title: Lobbies
    summary: >-
      Private lobbies for match rooms. A player creates a lobby, friends join by invite code, the host picks a mode and starts a room, and everyone comes back to the lobby afterwards. It is a module you add to a RoomHost, not a [Service]; options are passed in code, not read from config.
    use:
      - When friends or invited players play together (custom games, training) and a leader starts the match.
      - When a group must stay together between rooms and survive a reconnect during a room.
      - When lobbies must work across a fleet: a code joined on another server sends the player to the right one.
    avoid:
      - When strangers should be grouped automatically by playlist or rating. Use matchmaking instead.
      - When you have no match rooms. Lobbies start rooms on a RoomHost; see rooms.
    packages:
      - Altruist.Gaming.Lobbies
    docs:
      - /docs/gaming/lobbies
    paths:
      - Altruist/Gaming/Lobbies/
    types:
      - Altruist.Gaming.Lobbies.LobbyModule<TSim, TInput, TPlayer>
      - Altruist.Gaming.Lobbies.ILobbyGame<TSim, TInput, TPlayer>
      - Altruist.Gaming.Lobbies.LobbyOptions
      - Altruist.Gaming.Lobbies.Lobby<TSim, TInput, TPlayer>
      - Altruist.Gaming.Lobbies.LobbyMember<TPlayer>
      - Altruist.Gaming.Lobbies.LobbyRejectReason
    example: |-
      ```csharp
      // How you turn it on: create the module and add it to your RoomHost. Your game class
      // implements ILobbyGame<ArenaSim, PadInput, Profile> next to IRoomGame.
      var lobbies = new LobbyModule<ArenaSim, PadInput, Profile>(game,
          new LobbyOptions { MaxMembers = 6, Playlist = "private", Rules = new RoomRules { BotRefill = false } });
      host.Use(lobbies);

      // On the engine thread, on client commands:
      lobbies.Join(session, "");          // create a lobby; the code comes back in ILobbyGame.LobbyState
      lobbies.Join(session, "K7QXD");     // join by code
      lobbies.Start(session, "2v2");      // host only; ILobbyGame.TeamSizeOf("2v2") must not be null
      ```

  - name: dashboard
    title: Live Dashboard
    summary: >-
      The operations and debugging UI of a running server, served at /altruist/dashboard with JSON APIs under /dashboard/v1. It shows config, engine, fleet, connections, worlds, rooms, caches, vaults and traffic, and it can act: edit live config, drain the server, close rooms, run SQL, call any endpoint. A VS Code extension opens the same app in an editor tab. It is off until you turn it on, and it is an admin surface that must be protected.
    use:
      - When you develop or run a server and want to see the engine, worlds, rooms, traffic and fleet live.
      - When you need to inspect or change live state: config keys, cache entries, vault rows, rooms, connections, autosave.
      - When you want to draw debug shapes (spawn areas, aggro radii, paths) over a world with the gizmo registry.
    avoid:
      - When you need metrics and alerts for production monitoring. Export telemetry to a monitoring tool; the dashboard is an admin tool, not a monitoring system.
      - When the server is public and you have not set a token or a policy. Outside Development every dashboard request is refused with 503 until you do.
    packages:
      - Altruist.Dashboard
      - altruist-dashboard-vscode
    docs:
      - /docs/gaming/dashboard
      - /docs/gaming/dashboard/vscode-extension
    paths:
      - Altruist/Dashboard/
      - Altruist/Gaming/Main/Dashboard/
      - Altruist/Core/Framework/Contracts/DashboardNetworkRecorder.cs
      - Altruist/Core/Framework/Http/DashboardAccess.cs
      - VSCode/
    types:
      - Altruist.Dashboard.DashboardAccessOptions
      - Altruist.Dashboard.DashboardAccessMiddleware
      - Altruist.Dashboard.IDashboardGizmoRegistry
      - Altruist.Dashboard.DashboardGizmo
      - Altruist.Dashboard.IDashboardWorldSource
      - Altruist.Dashboard.DashboardWorldViewOptions
      - Altruist.IDashboardNetworkRecorder
      - Altruist.DashboardNetworkEvent
    config:
      - altruist:dashboard
    example: |-
      Reference the Altruist.Dashboard package, then turn it on and protect it. Security:
      - `token` is a shared secret of at least 16 characters (shorter counts as not set). Whoever has it can run SQL on your vaults, edit config, disconnect players and drain the server. Keep it in an environment variable.
      - `policy` names an ASP.NET Core authorization policy you register; signed-in users who satisfy it get in. If both are set, either grants access.
      - With neither set, in Development only, loopback requests (same machine) get in without credentials. `allow-loopback-without-token: false` turns that off. Requests that carry proxy headers are never treated as loopback.
      - With neither set outside Development, the server still runs but every dashboard request answers 503. Nothing is exposed.
      - Do not put the dashboard on the public internet without a strong token or policy and TLS. The browser login is `?dashboard_token=...` once, then an HttpOnly cookie.

      ```yaml
      altruist:
        dashboard:
          enabled: true
          token: ${DASHBOARD_TOKEN}      # >= 16 characters; or: policy: ops
          allow-loopback-without-token: true   # Development only; default true
          network:                       # traffic recorder (on by default when the dashboard is on)
            enabled: true
            maxEvents: 10000
            maxPayloadBytes: 32768
            redactFields: [password, token, authorization]
          world:
            renderScale: 1
            terrainSampleStride: 1       # raise for large heightfields
      ```

      ```csharp
      // Debug shapes over a world (inject IDashboardGizmoRegistry).
      gizmos.Upsert(new DashboardGizmo
      {
          Id = $"spawn:{spawnId}", WorldIndex = 0, Category = "spawns", Type = "circle",
          Color = "#F59E0BFF", Position = new Vector3Dto { X = p.X, Y = p.Y, Z = p.Z }, Radius = 4f,
      });
      ```

      In VS Code, install the altruist-dashboard-vscode .vsix and run "Altruist: Set Dashboard Token". The extension keeps the token in VS Code secret storage and reads the server address from `altruist.dashboard.baseUrl` or the workspace config.yml.

  - name: dotnet-client
    title: .NET Client
    summary: >-
      A client library for talking to an Altruist server from .NET: Unity, Godot, Blazor, console tools and test harnesses. It speaks the server's wire protocol over TCP, UDP or WebSocket with a MessagePack or JSON codec, and dispatches incoming packets to methods marked [Packet]. Transports are chosen in config.
    use:
      - When a .NET program (Unity, Godot, a bot, a load test) must connect to an Altruist server.
      - When you want one router that sends by gate name and can pick TCP, UDP or WebSocket per message.
      - When incoming packets should be routed by message code to your handler methods.
    avoid:
      - When the client is a browser game. Use the typescript-client packages instead.
      - When you write end-to-end tests of your own server in the same repo. Use the testing capability (Altruist.Testing); it has test clients with the same shape.
    packages:
      - Altruist.Client
    docs:
      - /docs/networking/client-packets
    paths:
      - Altruist/Client/Core/
    types:
      - Altruist.Client.IAltruistClientRouter
      - Altruist.Client.AltruistClientRouter
      - Altruist.Client.ClientTransportConfig
      - Altruist.Client.PacketHandlerAttribute
      - Altruist.Client.PacketAttribute
      - Altruist.Client.IClientCodec
      - Altruist.Client.MessagePackClientCodec
      - Altruist.Client.JsonClientCodec
    config:
      - altruist:client
    example: |-
      ```yaml
      # Each transport block that is present is brought up. Omit a block to leave that transport off.
      altruist:
        client:
          transport:
            defaultTransport: tcp          # tcp | udp | ws
            tcp: { host: 127.0.0.1, port: 5566, codec: { provider: messagepack } }
            ws:  { host: game.example.com, port: 443, secure: true, path: /game, codec: { provider: messagepack } }
      ```

      ```csharp
      [PacketHandler]
      public sealed class ChatHandlers
      {
          [Packet(typeof(ChatMessagePacket))]              // MessageCode read from the packet type
          public void OnChat(ChatMessagePacket msg) { }
      }

      public sealed class LoginFlow
      {
          private readonly IAltruistClientRouter _router;
          public LoginFlow(IAltruistClientRouter router) => _router = router;

          public async Task RunAsync(CancellationToken ct)
          {
              await _router.ConnectAsync(ct: ct);                                  // use autoPump: false and DrainInbound(64) in Unity's Update
              await _router.SendAsync("login", new LoginPacket { User = "alice" }, ct);
              await _router.Udp.SendAsync("move", new MovePacket { X = 1 }, ct);   // pick a transport explicitly
          }
      }
      ```

  - name: typescript-client
    title: TypeScript Client SDK
    summary: >-
      Dependency-free TypeScript packages for browser game clients. @altruist/net has the MessagePack wire format, the WebSocket transport (tickets, reconnect, heartbeat, fleet redirect) and ping and clock diagnostics. @altruist/client adds HTTP auth, the matchmaking and lobby flow, and device pairing. @altruist/input and @altruist/prediction match the server's room input and fixed-step clock, so the client can predict its own player exactly.
    use:
      - When a browser game connects to an Altruist server and you want the socket, token refresh and packet routing done.
      - When the game queues or joins lobbies and you want the phase machine that mirrors MatchmakingModule and LobbyModule.
      - When the client predicts its own movement against a RoomHost and must send inputs in the order and rate the server's input buffer expects.
    avoid:
      - When the client is .NET (Unity, Godot, console). Use the dotnet-client package.
      - When you only need the 2D physics and gameplay helpers to run the same simulation in the browser. That is typescript-sim2d.
    packages:
      - "@altruist/client"
      - "@altruist/net"
      - "@altruist/input"
      - "@altruist/prediction"
    docs:
      - /docs/client-sdk/overview
      - /docs/client-sdk/connection
      - /docs/client-sdk/auth
      - /docs/client-sdk/diagnostics
      - /docs/client-sdk/matchmaking
      - /docs/networking/client-input
      - /docs/networking/client-prediction
    paths:
      - Clients/TypeScript/client/
      - Clients/TypeScript/net/
      - Clients/TypeScript/input/
      - Clients/TypeScript/prediction/
    example: |-
      ```ts
      // Not on npm yet: point path aliases at Clients/TypeScript/*/src (see the overview doc).
      import { ApiClient } from '@altruist/client/auth';
      import { MatchmakingClient, queueStateName } from '@altruist/client/matchmaking';
      import { packetFrame, serverPacket, ticketUrl } from '@altruist/net';

      const api = new ApiClient({ baseUrl: '/api', sessionHintKey: 'mygame.signedIn' });
      if (api.hasSessionHint()) await api.refresh();          // refresh cookie becomes a session

      const mm = new MatchmakingClient({
        protocol: {
          queue: (playlist) => packetFrame('queue', 1007, playlist),
          cancelQueue: () => packetFrame('cancelqueue', 1008),
          rejoin: (room) => packetFrame('rejoin', 1010, room ?? ''),
          queueStatus: serverPacket(2007, (m) => ({ state: queueStateName(m[1]) ?? String(m[1]), playlist: String(m[2]),
            elapsed: Number(m[3]), playersFound: Number(m[4]), playersNeeded: Number(m[5]) })),
          welcome: serverPacket(2001, (m) => ({ roomId: String(m[1]) })),
        },
        socket: { url: ticketUrl({ base: 'wss://play.example.com/game', fetchTicket: () => api.connectionTicket('/game/ticket') }) },
      });
      mm.on('match', (welcome) => startMatch(mm.socket!, welcome));
      mm.queue('duel');
      ```

  - name: typescript-sim2d
    title: TypeScript 2D Simulation and AI
    summary: >-
      TypeScript twins of Altruist's 2D math, physics, gameplay verbs and flow building blocks (@altruist/sim2d), and of its receding-horizon game AI planner (@altruist/ai). They follow the C# operation order, so a browser client can run the same simulation as the server for prediction, replays, offline play and bots.
    use:
      - When the browser must reproduce server physics or gameplay exactly (client-side prediction, replays).
      - When you run bots or offline play in the browser using the same rules as the server.
      - When you want an anytime planner that scores candidate input programs by rolling out your own simulation (@altruist/ai).
    avoid:
      - When you only need sockets, auth or matchmaking in the browser. Use typescript-client.
      - When the simulation does not need to match the server. Use your own physics library; sim2d is for deterministic twins.
    packages:
      - "@altruist/sim2d"
      - "@altruist/ai"
    docs:
      - /docs/gaming/physics/typescript-sim2d
    paths:
      - Clients/TypeScript/sim2d/
      - Clients/TypeScript/ai/
    example: |-
      ```ts
      // Not on npm yet: point path aliases at Clients/TypeScript/sim2d/src (see the doc).
      import { DeterministicRandom } from '@altruist/sim2d/math';
      import { rayCastClosest } from '@altruist/sim2d/physics';
      import { GameplayVerbs2D as G } from '@altruist/sim2d/gameplay';
      import { RecedingPlanner } from '@altruist/ai';

      G.jumpOff(car.body, surfaceNormal, cfg.jumpSpeed);          // takes a planck.js Body directly
      const below = rayCastClosest(world, from, to, (f) => f.getUserData()?.kind === 'surface', reach);
      const rng = new DeterministicRandom(seed);                  // same sequence as the C# class

      const planner = new RecedingPlanner<Maneuver, Frame>({ recheckTicks: 6, switchMargin: 0.5, refineRounds: 2 });
      planner.restart(tick, candidates);
      planner.search(tick, 8, ops);                               // ops: start, frames, pressed, evaluate, noise, neighbours
      ```

