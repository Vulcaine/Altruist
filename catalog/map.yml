  - name: accounts-and-auth
    title: Accounts and Authentication
    summary: >-
      Everything for signing players in: BCrypt password hashing, HS256 JWT access tokens, rotating refresh tokens in an
      HttpOnly cookie, one-time tokens (email verification, password reset), session tokens for sockets, and the
      [Shield] attributes that protect portals and controllers on every transport. Altruist keeps the security-sensitive
      parts and leaves your account model to you.
    use:
      - When players must log in and you want signed access tokens, refresh tokens that detect stolen sessions, and password hashing that is already done right.
      - When a portal (WebSocket, TCP or UDP) or an HTTP controller must only be reachable by authenticated clients ([JwtShield], [SessionShield], [Shield(typeof(...))]).
      - When you need email verification or password reset links (one-time tokens) or a custom IShieldAuth such as an API key check.
      - When you want a ready login controller to extend (JwtAuthController gives signup, login, refresh and upgrade endpoints).
    avoid:
      - When a browser must open a WebSocket and cannot set an Authorization header, use connection-tickets instead of putting the token in the URL.
      - When you need to slow down password guessing or sign-up bots, add abuse-protection (lockout and captcha) on top.
      - When you only need request throttling, use the HTTP and socket rate limits of the networking capabilities, not auth.
    packages:
      - Altruist
    docs:
      - /docs/altruist/auth
      - /docs/altruist/auth/accounts
      - /docs/altruist/auth/fast-auth
      - /docs/extension/security
    paths:
      - Altruist/Core/Framework/Security/Auth/
      - Altruist/Core/Framework/Security/Hash/
      - Altruist/Core/Framework/Security/Http/
      - Altruist/Core/Framework/Security/Jwt/
      - Altruist/Core/Framework/Security/Session/
      - Altruist/Core/Framework/Security/Shield/
      - Altruist/Core/Framework/Security/Token/
      - Altruist/Core/Framework/Security/Database/
      - Altruist/Core/Framework/Security/Model.cs
      - Altruist/Core/Framework/Security/Packet.cs
      - Altruist/Core/Framework/Contracts/Authentication.cs
      - Altruist/Core/Framework/Config/AuthConfiguration.cs
    types:
      - Altruist.Security.AuthConfiguration
      - Altruist.Security.IPasswordHasher
      - Altruist.Security.IAccessTokenIssuer
      - Altruist.Security.IRefreshTokenService
      - Altruist.Security.RefreshCookie
      - Altruist.Security.IOneTimeTokenStore
      - Altruist.Security.Http.JwtAuthController
      - Altruist.IShieldAuth
    config:
      - altruist:security
    example: |-
      Safe by default: tokens are HS256 only and need an expiry; passwords use BCrypt (work factor 11); the refresh
      token lives in an HttpOnly cookie and only its SHA-256 is stored. Not safe by default: if `key` is unset Altruist
      uses a PUBLIC development key. In Production an app with an `altruist:security` section refuses to start when the
      key is unset, is the development key, or is shorter than `min-key-bytes` (32 bytes). Set the key from the
      environment, for example `ALTRUIST__SECURITY__KEY=$(openssl rand -base64 48)`.
      Pick `password:prehash` before you store hashes: hashes of the two modes do not verify against each other.
      ```yaml
      altruist:
        security:
          mode: jwt                  # jwt (default) | session
          key: ""                    # set from ALTRUIST__SECURITY__KEY, never commit it
          min-key-bytes: 32          # shorter keys are refused in Production
          access-token-minutes: 15
          password:
            work-factor: 11          # BCrypt cost, 4-31
            prehash: none            # none | sha384 (sha384 stops the 72-byte BCrypt truncation)
          refresh-tokens:
            lifetime-days: 30
            max-sessions: 10
          refresh-cookie:
            same-site: strict        # strict | lax | none
      ```
      ```csharp
      [Vault("refresh_tokens", Keyspace: "myapp")]
      public sealed class RefreshTokenVault : RefreshTokenModel { }

      [ApiController, Route("auth")]
      public sealed class AuthController(
          IRefreshTokenService refresh, IAccessTokenIssuer access, RefreshCookie cookie, Accounts accounts) : ControllerBase
      {
          [HttpPost("login")]
          public async Task<IActionResult> Login(LoginRequest body, CancellationToken ct)
          {
              var account = await accounts.VerifyAsync(body.Username, body.Password, ct);
              if (account is null) return Unauthorized();
              cookie.Append(Response, await refresh.IssueAsync(account.Id, ct: ct));
              return Ok(new { accessToken = access.Issue(account.Id).Token });
          }
      }

      [Portal("/game")]
      [JwtShield]
      public class SecureGamePortal : AltruistPortal { }
      ```

  - name: abuse-protection
    title: Lockout and Captcha
    summary: >-
      Two small building blocks against password guessing and sign-up bots. IFailureLockout locks a key after repeated
      failures; ICaptchaVerifier checks a Turnstile, hCaptcha or reCAPTCHA token on the server. Both are registered
      by default and do nothing until you call them.
    use:
      - When a login or reset endpoint needs a lockout after N failures inside a time window.
      - When the failure budget must hold across a fleet of servers (set lockout store to backplane, which needs Redis).
      - When sign-up or login needs a captcha check on the server.
    avoid:
      - When you only want to cap request volume per client, use the HTTP or socket rate limits instead.
      - When you need to prove who a player is, use accounts-and-auth. Lockout and captcha do not authenticate.
    packages:
      - Altruist
      - Altruist.Redis
    docs:
      - /docs/altruist/auth/abuse
      - /docs/extension/shield
    paths:
      - Altruist/Core/Framework/Security/Captcha/
      - Altruist/Core/Framework/Security/Lockout/
    types:
      - Altruist.Security.IFailureLockout
      - Altruist.Security.FailureLockoutOptions
      - Altruist.Security.ICaptchaVerifier
      - Altruist.Security.CaptchaOptions
      - Altruist.Security.TurnstileCaptchaVerifier
    config:
      - altruist:security:captcha
      - altruist:security:lockout
    example: |-
      Safe by default: the captcha fails closed (an unreachable verifier rejects the token) and lockout keys are stored
      hashed. The captcha is OFF until `secret-key` is set, and then `VerifyAsync` returns true, so refuse to boot in
      Production yourself if you require one. Never lock by user name alone: combine it with the client address and add
      a budget per address.
      ```yaml
      altruist:
        security:
          lockout:
            store: memory            # memory (default) | backplane (shared by the fleet)
          captcha:
            provider: turnstile      # turnstile | hcaptcha | recaptcha
            site-key: "0x4AAAA..."   # public, the client widget uses it
            secret-key: ""           # from ALTRUIST__SECURITY__CAPTCHA__SECRET_KEY
      ```
      ```csharp
      var userKey = $"login:{name.ToLowerInvariant()}|{clientIp}";
      var locked = await lockout.LockedForAsync(userKey);
      if (locked > TimeSpan.Zero) throw new HttpApiException(429, "locked", "Too many failed attempts.");

      if (!hasher.Verify(password, account?.PasswordHash))
      {
          await lockout.RecordFailureAsync(userKey, 5, TimeSpan.FromMinutes(15), TimeSpan.FromMinutes(15));
          throw new HttpApiException(401, "invalid_credentials", "Invalid username or password.");
      }
      await lockout.ClearAsync(userKey);

      if (captcha.Enabled && !await captcha.VerifyAsync(body.CaptchaToken ?? "", HttpContext.ClientIp()))
          throw new HttpApiException(400, "captcha_failed", "The security check failed.", "captcha");
      ```

  - name: connection-tickets
    title: Connection Tickets
    summary: >-
      One-time tickets that let a browser open an authenticated WebSocket without putting a long-lived token in the URL.
      The client trades its access token for a ticket valid for seconds, connects with ?ticket=, and the portal's
      [TicketShield] redeems it exactly once.
    use:
      - When a browser client connects to a portal over WebSocket and cannot send an Authorization header.
      - When tickets issued by one server must be redeemed by another (they live in the fleet backplane, so use Redis for a fleet).
    avoid:
      - When the client can send a header (native, TCP or UDP clients), use [JwtShield] or [SessionShield] from accounts-and-auth.
      - When you need a long-lived login token or a refresh flow, use accounts-and-auth. A ticket is single-use and short.
    packages:
      - Altruist
      - Altruist.Redis
    docs:
      - /docs/altruist/auth/tickets
    paths:
      - Altruist/Core/Framework/Security/Tickets/
    types:
      - Altruist.Security.IConnectionTicketService
      - Altruist.Security.ConnectionTicketService
      - Altruist.Security.ConnectionTicket
      - Altruist.Security.ConnectionTicketOptions
      - Altruist.Security.TicketShieldAuth
    config:
      - altruist:security:tickets
    example: |-
      Safe by default: only the SHA-256 of a ticket is stored, redemption is an atomic take (a second use fails), and
      request log lines that contain the ticket URL are reduced to warnings (`redact-request-logs: true`). Write the
      issuing endpoint yourself so your own rules (bans, maintenance) apply.
      ```yaml
      altruist:
        security:
          tickets:
            query-param: ticket
            ttl-seconds: 30
            max-per-principal: 4
            session-hours: 12
            redact-request-logs: true
      ```
      ```csharp
      [ApiController, Route("api"), Authorize]
      public sealed class TicketController(IConnectionTicketService tickets) : ControllerBase
      {
          [HttpPost("ticket")]
          public async Task<IActionResult> Ticket(CancellationToken ct)
          {
              var id = User.PrincipalId() ?? throw new UnauthorizedAccessException();
              var t = await tickets.IssueAsync(id, groupKey: User.PrincipalName(), ct);
              return Ok(new { ticket = t.Ticket, expiresIn = t.ExpiresInSeconds });
          }
      }

      [Portal("/game")]
      [TicketShield]
      public class GamePortal : AltruistPortal { }
      ```

  - name: persistence
    title: Persistence and the Unified Object Model
    summary: >-
      The data layer: model classes marked with [Vault] attributes (the Unified Object Model, UORM) map to database
      tables, a database provider connects to the database, and [Transactional] wraps service methods in a transaction.
      You write the model once and the provider creates and migrates the table.
    use:
      - When you need to store players, items or any game data in a database and describe the tables as C# classes.
      - When several operations must succeed or roll back together ([Transactional] on a service method).
      - When you want to route a model to a read replica or another database instance (DbInstance on [Vault]).
      - When you want to seed data at startup (IDatabaseInitializer).
    avoid:
      - When you only need fast shared in-memory or Redis state with no tables, use cache instead.
      - When you flush many hot, frequently changing rows, use autosave on top of the vault.
      - When you need to read or write rows, use vault (IVault of T). This capability is the model and provider layer.
    packages:
      - Altruist
      - Altruist.Postgres
    docs:
      - /docs/altruist/persistence
      - /docs/altruist/persistence/orm
      - /docs/altruist/orm
      - /docs/altruist/persistence/hooks
      - /docs/altruist/persistence/sync-services
      - /docs/altruist/persistence/database-initializers
      - /docs/extension/database
      - /docs/deployment/database-scaling
    paths:
      - Altruist/Core/Framework/Persistence/UORM/
      - Altruist/Core/Framework/Persistence/Database/
      - Altruist/Core/Framework/Persistence/Transactions/
      - Altruist/Core/Framework/Contracts/Database.cs
      - Altruist/Core/Framework/Contracts/Querying.cs
    types:
      - Altruist.UORM.VaultAttribute
      - Altruist.UORM.VaultColumnAttribute
      - Altruist.Persistence.TransactionalAttribute
      - Altruist.Persistence.IDatabaseInitializer
      - Altruist.IGeneralDatabaseProvider
      - Altruist.Persistence.ISqlDatabaseProvider
      - Altruist.IKeyspace
    config:
      - altruist:persistence:database
      - altruist:persistence:database:provider
    example: |-
      The only provider published to NuGet is Postgres (`provider: postgres`). Put real credentials in environment
      variables, not in config.yml.
      ```yaml
      altruist:
        persistence:
          database:
            provider: postgres
            host: localhost
            port: 5432
            username: myuser
            password: ""          # ALTRUIST__PERSISTENCE__DATABASE__PASSWORD
            database: mydb
      ```
      ```csharp
      [Vault("accounts")]
      [VaultUniqueKey("username")]
      public class AccountVault : VaultModel
      {
          [VaultColumn] public override string StorageId { get; set; } = "";
          [VaultColumn("username")] public string Username { get; set; } = "";
          [VaultColumn, VaultColumnIndex] public int Level { get; set; }
      }

      [Service]
      public class TradeService(IVault<ItemVault> items, IVault<PlayerVault> players)
      {
          [Transactional]
          public async Task Transfer(string itemId, string toPlayerId) { /* all or nothing */ }
      }

      public sealed class SeedInitializer : IDatabaseInitializer
      {
          public int Order => 0;
          public async Task InitializeAsync(IServiceProvider services)
          {
              var vault = services.GetRequiredService<IVault<AccountVault>>();
              if (await vault.CountAsync() > 0) return;   // runs on every start: guard it
          }
      }
      ```

  - name: vault
    title: Vault (IVault)
    summary: >-
      IVault of T is the API your code uses to read and write one table: fluent Where, OrderBy, Skip and Take, then
      async terminals such as ToListAsync, FirstOrDefaultAsync, SaveAsync, UpdateAsync and DeleteAsync. It also keeps a
      history table when the model asks for it.
    use:
      - When you query, save, update or delete rows of a [Vault] model.
      - When you need an audit trail of saves (StoreHistory on [Vault], then SaveAsync with saveHistory true).
      - When you need joins over several vault tables (IVaultJoinQuery).
    avoid:
      - When you load a root record with its related rows in one call, use prefabs.
      - When a hot object is changed many times a second, use autosave so the database is hit in batches.
      - When the data is not relational, use cache.
    packages:
      - Altruist
      - Altruist.Postgres
    docs:
      - /docs/altruist/persistence/vault
      - /docs/altruist/persistence
    paths:
      - Altruist/Core/Framework/Persistence/Vault/
    types:
      - Altruist.IVault<TVaultModel>
      - Altruist.IHistoricalVault<TVaultModel>
      - Altruist.IVaultModel
      - Altruist.VaultModel
      - Altruist.VaultRegistry
      - Altruist.Querying.IVaultQuery<T>
      - Altruist.Persistence.OptimisticConcurrencyException
    example: |-
      ```csharp
      [Service]
      public class PlayerService(IVault<PlayerVault> players)
      {
          public Task<List<PlayerVault>> TopAsync() =>
              players.Where(p => p.Level >= 50).OrderByDescending(p => p.Level).Take(20).ToListAsync();

          public Task SaveAsync(PlayerVault player) => players.SaveAsync(player, saveHistory: true);

          public Task LevelUpAsync(string id) => players
              .Where(p => p.StorageId == id)
              .UpdateAsync(s => s.SetProperty(p => p.Level, p => p.Level + 1));

          public async Task<bool> ExistsAsync(string name) => await players.AnyAsync(p => p.Name == name);
      }
      ```

  - name: cache
    title: Cache
    summary: >-
      A key-value cache behind one interface, ICacheProvider, with an in-memory backend (default) and a Redis backend.
      It holds hot or shared state such as session tokens and cross-server data.
    use:
      - When you keep fast, short-lived or shared state: session tokens, presence, leaderboards snapshots.
      - When several servers must see the same state (use the Redis provider).
      - When tests or a single dev server should run without Redis (use the inmemory provider).
    avoid:
      - When data must survive a restart, store it with vault. The in-memory cache loses everything on restart.
      - When you need queries and relations, use vault.
    packages:
      - Altruist
      - Altruist.Redis
    docs:
      - /docs/altruist/persistence
      - /docs/deployment/database-scaling
    paths:
      - Altruist/Core/Framework/Persistence/Cache/
      - Altruist/Core/Framework/Contracts/Cache.cs
      - Altruist/Core/Framework/Contracts/Store.cs
      - Altruist/Redis/Core/Store/
    types:
      - Altruist.ICacheProvider
      - Altruist.IMemoryCacheProvider
      - Altruist.IRemoteCacheProvider
      - Altruist.IRedisCacheProvider
      - Altruist.InMemory.InMemoryCache
      - Altruist.Redis.RedisCacheProvider
      - Altruist.IConnectionStore
    config:
      - altruist:persistence:cache
    example: |-
      Session tokens are stored in the cache, so use Redis in production: `inmemory` loses all sessions on restart.
      ```yaml
      altruist:
        persistence:
          cache:
            provider: redis      # inmemory (default for dev) | redis
          redis:
            connection-string: "localhost:6379"
      ```
      ```csharp
      [Service]
      public class Presence(ICacheProvider cache)
      {
          public Task SetAsync(string playerId, PlayerState state) => cache.SaveAsync(playerId, state);
          public Task<PlayerState?> GetAsync(string playerId) => cache.GetAsync<PlayerState>(playerId);
      }
      ```

  - name: prefabs
    title: Prefabs
    summary: >-
      A prefab is a composite entity that loads and saves a root vault model together with its related rows (single
      references and collections) in one call. It saves only the parts that changed, in one batched statement.
    use:
      - When a player or character is spread over several tables (account, items, equipment, guild) and you load it as one object.
      - When you filter by the root or by a child (Any on a collection) and eager-load only the components you need.
    avoid:
      - When one table is enough, inject IVault of T directly.
      - When a save must also delete removed children. Prefab saves are upserts only; delete through the child's vault.
    packages:
      - Altruist
      - Altruist.Postgres
    docs:
      - /docs/altruist/persistence/prefabs
    paths:
      - Altruist/Core/Framework/Persistence/Prefab/
      - Altruist/Postgres/Core/Prefab/
    types:
      - Altruist.Persistence.IPrefabs
      - Altruist.Persistence.IPrefabQuery<TPrefab>
      - Altruist.Persistence.PrefabModel
      - Altruist.IPrefabModel
      - Altruist.Persistence.PgPrefabs
    example: |-
      ```csharp
      [Prefab("character")]
      public class CharacterPrefab : PrefabModel
      {
          [PrefabComponentRoot]
          public CharacterVault Character { get; set; } = default!;

          [PrefabComponentRef(principal: nameof(Character), foreignKey: nameof(ItemVault.CharacterId))]
          public List<ItemVault> Items { get; set; } = new();
      }

      var player = await prefabs.Query<CharacterPrefab>()
          .Where(p => p.Character.Name == "alice")
          .Include(p => p.Items)
          .FirstOrDefaultAsync();
      player!.Items.Add(newItem);
      await prefabs.SaveComponentAsync(player, nameof(CharacterPrefab.Items));
      ```

  - name: migrations
    title: Code-First Migrations
    summary: >-
      At every start Altruist compares your [Vault] models with the live database schema and applies the difference:
      new tables, columns, indexes, unique keys and foreign keys, a primary key an existing table lacks, renames and type changes. There are no migration files
      and no CLI. Destructive changes happen only when you ask for them.
    use:
      - When you add, rename or retype a column and want the database to follow the C# model on restart.
      - When you move data between columns ([VaultColumnCopy], [VaultRenamedFrom]) or retire tables ([VaultTableDelete], [VaultArchived]).
    avoid:
      - When you need hand-written SQL or a reviewed migration history. Altruist does not produce migration files.
      - When you only seed rows, use IDatabaseInitializer from persistence.
    packages:
      - Altruist
      - Altruist.Postgres
    docs:
      - /docs/altruist/persistence/migrations
      - /docs/altruist/persistence/database-initializers
    paths:
      - Altruist/Core/Framework/Migrations/
      - Altruist/Postgres/Core/Migrations/
    types:
      - Altruist.Migrations.IVaultSchemaMigrator
      - Altruist.Migrations.IMigrationPlanner
      - Altruist.Migrations.IMigrationExecutor
      - Altruist.Migrations.ISchemaInspector
      - Altruist.Migrations.MigrationOperation
      - Altruist.Migrations.Postgres.PostgresMigrationPlanner
    config:
      - altruist:persistence:migration
    example: |-
      Safe by default: a column you remove from the model stays in the database with its data (a warning is logged).
      Columns are dropped only with [VaultDropColumn], [VaultColumnDelete] or `drop-unmapped-columns: true`. Before
      0.9.9-beta every unmapped column was dropped, so check this flag if you rely on the old cleanup.
      ```yaml
      altruist:
        persistence:
          migration:
            drop-unmapped-columns: false   # default
            batch-size: 50000              # rows per batch while copying a column
      ```
      ```csharp
      [Vault("players")]
      public class PlayerVault : VaultModel
      {
          [VaultColumn] public override string StorageId { get; set; } = "";

          [VaultColumn("display_name")]
          [VaultRenamedFrom("name")]          // renames the column, keeps the data
          public string DisplayName { get; set; } = "";

          [VaultColumn, VaultColumnIndex]     // added on the next start
          public int Level { get; set; }
      }
      ```

  - name: postgres
    title: PostgreSQL Provider
    summary: >-
      The PostgreSQL implementation of the persistence layer: connection and pooling, SQL translation for IVault queries,
      transactions, schema isolation, prefabs and migrations. Enabled with `provider: postgres`. It is the only database
      provider published as a NuGet package.
    use:
      - When your game stores data in PostgreSQL (the default and recommended store).
      - When you want a primary plus read replicas or an analytics database (list `instances`, route a model with DbInstance).
    avoid:
      - When you only need a cache, use the cache capability and Redis.
      - When you want ScyllaDB or EF Core, note that those modules exist in the repo but are not published (see unpublished-stores).
    packages:
      - Altruist.Postgres
    docs:
      - /docs/altruist/persistence
      - /docs/deployment/database-scaling
    paths:
      - Altruist/Postgres/
    types:
      - Altruist.Persistence.Postgres.PgSqlDbProvider
      - Altruist.Persistence.Postgres.PgSqlDbInstanceProvider
      - Altruist.Persistence.Postgres.PgVault<TVaultModel>
      - Altruist.Persistence.Postgres.PostgresDatabaseConfiguration
      - Altruist.Persistence.Postgres.SchemaIsolation
    config:
      - altruist:persistence:database:host
      - altruist:persistence:database:port
      - altruist:persistence:database:database
      - altruist:persistence:database:username
      - altruist:persistence:database:password
      - altruist:persistence:database:pooling
      - altruist:persistence:database:max-pool-size
      - altruist:persistence:database:ssl-mode
      - altruist:persistence:database:instances
    example: |-
      `ssl-mode` defaults to `disable`. For a database outside your private network set `require`, `verify-ca` or
      `verify-full`. Any other value stops the server at start. The session time zone is forced to UTC. Keep the
      password in an environment variable. The `Postgres/Core/E2E` controller (`altruist:e2e:enabled`) is test support.
      ```yaml
      altruist:
        persistence:
          database:
            provider: postgres
            host: db-primary.example.com
            port: 5432
            username: gameserver
            password: ""            # ALTRUIST__PERSISTENCE__DATABASE__PASSWORD
            database: mygame
            pooling: true
            max-pool-size: 300
            ssl-mode: verify-full
      ```
      ```yaml
      # several databases: primary, read replica
      altruist:
        persistence:
          database:
            provider: postgres
            instances:
              - { name: primary, host: db1, port: 5432, username: app, password: "", database: mygame, role: readwrite }
              - { name: replica, host: db2, port: 5432, username: app_ro, password: "", database: mygame, role: readonly }
      ```
      ```csharp
      [Vault("players", DbInstance = "replica")]
      public class LeaderboardReadVault : VaultModel { /* columns */ }
      ```

  - name: redis
    title: Redis Module
    summary: >-
      The Redis connection and its building blocks: the shared connection factory, Redis-backed message routers and
      ingress/egress endpoints for multi-server pub/sub. The Redis cache provider and the fleet backplane have their own
      capabilities (cache, fleet-and-server-nodes) and are delivered by the same package.
    use:
      - When several servers share a cache, session tokens or messages and you need a Redis connection configured once.
      - When channels or servers must forward packets to each other over Redis pub/sub.
    avoid:
      - When one server is enough, use the in-memory cache (no Redis needed).
      - When you want a cache API, start from cache. This capability is the connection and routing plumbing.
    packages:
      - Altruist.Redis
