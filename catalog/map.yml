  - name: lag-compensation
    title: Lag Compensation
    summary: >-
      Keeps a short history of entity positions and lets the server rewind the world to the tick a client saw when it acted. Use it to
      judge hits fairly for players with latency. Live transforms are never changed; the rewind uses an override map.
    use:
      - When hit or melee validation must use where targets were on the client's screen, not where they are now.
      - When a packet must carry the client's tick (implement ILagCompensated).
    avoid:
      - When the client predicts and the server simulates the same fixed-step logic. Use [flow] with prediction instead.
      - When gameplay is not spatial or time-sensitive.
    packages:
      - Altruist.Gaming
    docs:
      - /docs/gaming/lag-compensation
    paths:
      - Altruist/Gaming/Main/Core/General/LagCompensation/
      - Altruist/Gaming/Main/Core/General/IPositionHistoryRecorder.cs
      - Altruist/Core/Framework/Networking/ILagCompensated.cs
    types:
      - Altruist.Gaming.ILagCompensationService
      - Altruist.Gaming.LagCompensationService
      - Altruist.Gaming.LagCompensationSnapshotStrategy
      - Altruist.Gaming.PositionSnapshot
      - Altruist.ILagCompensated
    config:
      - altruist:game:lag-compensation
    example: |-
      ```yaml
      altruist:
        game:
          lag-compensation:
            history-ticks: 64          # about 2.5 s at 25 Hz
            snapshot-strategy: nearest # or interpolate
      ```

      ```csharp
      var hit = _lagCompensation.RewindWorld(packet.ClientTick, () =>
      {
          var (ax, ay, az) = _lagCompensation.Compensate(attacker.VirtualId, attacker.X, attacker.Y, attacker.Z);
          var yaw = _lagCompensation.CompensateYaw(attacker.VirtualId, attacker.FacingYaw);
          return IsInCone(ax, ay, az, yaw, target);
      });
      ```

  - name: ai-behaviors
    title: AI Behaviors
    summary: >-
      Write a monster's brain as a plain class with [AIBehavior] and [AIState] methods. The framework finds the class, makes one state
      machine per entity, ticks it every engine frame, skips hibernated entities and cleans up when an entity leaves. Also has a
      receding-horizon planner for bots that plan ahead.
    use:
      - When NPCs or monsters need states such as idle, chase, attack and return.
      - When bots in a match room need the same behaviors with a machine you create and tick yourself.
      - When an agent must plan a short sequence of actions (RecedingPlanner).
    avoid:
      - When you need a state machine that is not AI (a door, a combo, a quest). Use [state-machines].
      - When bot decisions must replay exactly on a TypeScript client. Use the UtilitySelector in [flow].
    packages:
      - Altruist.Gaming
    docs:
      - /docs/gaming/ai
    paths:
      - Altruist/Gaming/Main/Core/General/AI/
    types:
      - Altruist.Gaming.AIBehaviorAttribute
      - Altruist.Gaming.AIStateAttribute
      - Altruist.Gaming.AIStateEnterAttribute
      - Altruist.Gaming.AIStateExitAttribute
      - Altruist.Gaming.IAIBehaviorEntity
      - Altruist.Gaming.IAIContext
      - Altruist.Gaming.AIBehaviorService
    example: |-
      ```csharp
      [AIBehavior("aggressive_monster")]
      public sealed class AggressiveMonsterBehavior
      {
          [AIState("Idle", Initial = true)]
          public string? Idle(MonsterAIContext ctx, float dt)
              => ctx.Target is { IsDead: false } ? "Chase" : null;   // return the next state, or null to stay

          [AIState("Attack", Delay = 1.5f)]
          public string? Attack(MonsterAIContext ctx, float dt) { DealDamage(ctx); return "Chase"; }

          [AIStateEnter("Chase")]
          public void OnChase(MonsterAIContext ctx) { }
      }

      [WorldObject("monster")]
      public sealed class MonsterEntity : WorldObject3D, IAIBehaviorEntity
      {
          public string AIBehaviorName => "aggressive_monster";
          public IAIContext AIContext { get; set; } = null!;
      }
      ```

  - name: state-machines
    title: State Machines
    summary: >-
      A generic finite state machine for gameplay: doors, combos, boss phases, quests, match phases. State methods return the next state name.
      You build an immutable definition once, make one machine per context, and call Update. It has timing windows and motion curves for
      combos and attacks. The AI layer is built on it.
    use:
      - When something has named states with timed transitions and you want no switch statements.
      - When an attack or combo needs timing windows (a hit window, a cancel window) and a motion profile.
      - When the machine has no world entity, such as a bot in a match room.
    avoid:
      - When you want automatic discovery and per-entity ticking for monsters. Use [ai-behaviors].
      - When the same state logic must run bit for bit on a TypeScript client. Use [flow], which adds Advance and RunState.
    packages:
      - Altruist.Gaming
      - "@altruist/sim2d"
    docs:
      - /docs/gaming/state-machines
      - /docs/gaming/combo-state-machine
    paths:
      - Altruist/Gaming/Main/Core/General/StateMachine/
    types:
      - Altruist.Gaming.StateMachine<TContext>
      - Altruist.Gaming.StateMachineBuilder<TContext>
      - Altruist.Gaming.IStateContextCore
      - Altruist.Gaming.StateBehaviorAttribute
      - Altruist.Gaming.StateAttribute
      - Altruist.Gaming.StateWindowAttribute
      - Altruist.Gaming.StateMotionProfile
    example: |-
      ```csharp
      [StateBehavior("door")]
      public sealed class DoorBehavior
      {
          [State("Closed", Initial = true)]
          public string? Closed(DoorContext ctx, float dt) => ctx.OpenRequested ? "Opening" : null;

          [State("Opening")]
          public string? Opening(DoorContext ctx, float dt) => ctx.Progress >= 1f ? "Open" : null;
      }

      var def = new StateMachineBuilder<DoorContext>()
          .RegisterHandlers<DoorBehavior>()
          .ConfigureState("Opening").Duration(0.75f)
          .Build();

      var fsm = new StateMachine<DoorContext>(def);
      fsm.Initialize(context);
      fsm.Update(context, dt);          // from your own tick
      ```

  - name: flow
    title: Flow (Deterministic Tick Building Blocks)
    summary: >-
      Small helpers for the code that runs every tick of a real-time match: ordered rule lists (FirstMatch), tick phases (TickPipeline),
      modifier stacks, bot utility choice, timers, input edges, entity registries and event sinks. They run in a fixed order with no
      allocation, and the TypeScript version behaves the same, so server and client compute the same result. It is for deterministic
      tick logic shared by server and client.
    use:
      - When the client predicts the server by running the same simulation, and the two must not drift apart.
      - When matches are replayed or rolled back and must give the same result.
      - When game modes or tests must insert, replace or remove one rule by name instead of copying a whole Step().
      - When bots must make the same choices for the same seed (UtilitySelector with DeterministicRandom).
    avoid:
      - When the server only stores state and checks requests (turn-based, lobbies, simple RPG commands). Plain code is fine.
      - When you need a state machine for match phases. Use [state-machines].
    packages:
      - Altruist.Gaming
      - Altruist.Physx
      - "@altruist/sim2d"
    docs:
      - /docs/gaming/flow
      - /docs/gaming/physics/typescript-sim2d
    paths:
      - Altruist/Gaming/Main/Core/General/Flow/
    types:
      - Altruist.Gaming.Flow.FirstMatch<TCtx, TResult>
      - Altruist.Gaming.Flow.TickPipeline<TCtx>
      - Altruist.Gaming.Flow.ModifierStack<TCtx>
      - Altruist.Gaming.Flow.UtilitySelector<TOption, TCtx>
      - Altruist.Gaming.Flow.Countdown
      - Altruist.Gaming.Flow.TimerSet
      - Altruist.Gaming.Flow.EntityRegistry<TKey, T>
      - Altruist.Gaming.Flow.EventSink<TEvent>
    example: |-
      ```csharp
      using Altruist.Gaming.Flow;

      var rules = FirstMatch<HitContext, float>.Create()
          .When("super",   c => c.SuperStrike,   c => cfg.SuperStrikeMultiplier)
          .When("kick",    c => c.Kick,          c => MathF.Max(c.ZoneMult, cfg.Nose) * cfg.FlipKick)
          .Otherwise(c => c.ZoneMult);

      // A game mode adds a rule by name, before another one.
      rules.Before("super").When("overcharged", c => c.Overcharged, 4f);

      var multiplier = rules.Build();            // once, at setup
      float mult = multiplier.Evaluate(ctx);     // every tick, no allocation

      Countdown.Tick(ref car.DashCooldown, dt);  // t = max(0, t - dt)
      ```

      ```ts
      // Same shape on the client.
      import { FirstMatch } from '@altruist/sim2d/flow';
      const rules = FirstMatch.create<HitContext, number>().when('super', c => c.superStrike, () => cfg.superStrikeMultiplier);
      ```

  - name: numerics
    title: Numerics (Deterministic Math)
    summary: >-
      The math a simulation keeps rewriting: scalar clamps and approaches, angle wrapping, safe vector normalization, tuning curves, a seeded
      random generator, positions, rotations and transforms for 2D and 3D, box and ray tests. Each helper evaluates exactly the formula in its
      summary, so results match bit for bit across runs. The TypeScript package mirrors it.
    use:
      - When a simulation must replay exactly or match a client (use DeterministicRandom, not System.Random).
      - When you need angle wrapping, Approach, Lerp, PiecewiseLinear curves or safe NormalizeOrZero.
      - When you need Position3D, Rotation3D, Transform3D and their 2D twins.
    avoid:
      - When you need operations on bodies and contacts. Use [motion-2d] or [physics-2d].
      - When exact repeatability does not matter and System.Numerics is enough.
    packages:
      - Altruist
      - "@altruist/sim2d"
    docs:
      - /docs/gaming/physics/numerics
      - /docs/gaming/physics/typescript-sim2d
    paths:
      - Altruist/Core/Framework/Numerics/
    types:
      - Altruist.Numerics.Scalar
      - Altruist.Numerics.Angle
      - Altruist.Numerics.DeterministicRandom
      - Altruist.Numerics.PiecewiseLinear
      - Altruist.TwoD.Numerics.VectorMath2D
      - Altruist.ThreeD.Numerics.Transform3D
      - Altruist.TwoD.Numerics.Transform2D
    example: |-
      ```csharp
      using Altruist.Numerics;
      using Altruist.TwoD.Numerics;

      speed = Scalar.Approach(speed, maxSpeed, acceleration * dt);
      var turn = Angle.ShortestDifference(heading, targetHeading);
      var dir = VectorMath2D.NormalizeOrZero(velocity);

      var rng = new DeterministicRandom(seed: matchId);   // same sequence on every runtime
      bool crit = rng.Chance(0.25);
      uint saved = rng.State;                             // for rollback
      ```

  - name: physics-2d
    title: 2D Physics (Box2D)
    summary: >-
      A 2D physics engine behind a clean API. PhysxWorldEngine2D.Create makes a standalone Box2D world that you own and step yourself: bodies,
      fixtures, shapes, contacts and ray casts. Use it for an authoritative match, a prediction scratch world, a bot trainer or a test.
      Also holds the 2D collider models and body profiles that world objects use.
    use:
      - When you simulate a 2D match yourself and step it from a fixed-rate stepper.
      - When you need a headless physics world for tests, replays or bot training.
      - When 2D world objects need colliders and body profiles (box, circle, capsule, polygon).
    avoid:
      - When the game is 3D. Use [physics-3d].
      - When you only need velocity math or gameplay verbs on bodies. Use [motion-2d].
    packages:
      - Altruist.Physx
      - Altruist.Gaming
    docs:
      - /docs/gaming/physics/simulation-2d
    paths:
      - Altruist/Physx/Core/2D/
      - Altruist/Gaming/Main/Core/2D/Physx/
    types:
      - Altruist.Physx.PhysxWorldEngine2D
      - Altruist.Physx.IPhysxWorldEngine2D
      - Altruist.Physx.IPhysxWorldEngineFactory2D
      - Altruist.Physx.TwoD.PhysxWorldSettings2D
      - Altruist.Physx.TwoD.IPhysxBody2D
      - Altruist.Physx.TwoD.PhysxBodyDef2D
      - Altruist.Physx.TwoD.PhysxFixtureDef2D
      - Altruist.Gaming.TwoD.HumanoidCapsuleBodyProfile2D
    example: |-
      ```csharp
      using System.Numerics;
      using Altruist.Physx;
      using Altruist.Physx.TwoD;

      var world = PhysxWorldEngine2D.Create(new PhysxWorldSettings2D
      {
          Gravity = new Vector2(0, -10),
          FixedDeltaTime = 1f / 60f,
          VelocityIterations = 8,
          PositionIterations = 3,
      });

      for (var tick = 0; tick < 600; tick++)
          world.Step(world.FixedDeltaTime);   // pass the same fixed value every step

      world.Dispose();
      ```

  - name: motion-2d
    title: 2D Motion and Gameplay Verbs
    summary: >-
      Two layers on top of 2D bodies. The physics layer has velocity, bounce, drag, gravity, ray cast and ballistic helpers. The gameplay layer
      has designer-level verbs such as JumpOff, DriveAlong, StickTo, AlignToSurface and AimAt. Each verb delegates to a physics helper, which
      delegates to numerics, in a fixed operation order. The TypeScript package has the same API.
    use:
      - When you write the movement of a car, ball or character in a 2D match and want the code to read like the rules.
      - When a client must predict that movement and match the server.
      - When you need to predict a flight path or check whether a jump can reach a height.
    avoid:
      - When you need 3D character movement. Use [character-movement].
      - When you only need pure math with no bodies. Use [numerics].
    packages:
      - Altruist.Physx
      - Altruist.Gaming
      - "@altruist/sim2d"
    docs:
      - /docs/gaming/physics/motion-2d
      - /docs/gaming/physics/gameplay-verbs
      - /docs/gaming/physics/typescript-sim2d
    paths:
      - Altruist/Physx/Core/2D/Motion/
      - Altruist/Physx/Core/Motion/
      - Altruist/Gaming/Main/Core/2D/Gameplay/
    types:
      - Altruist.Gaming.TwoD.GameplayVerbs2D
      - Altruist.Physx.TwoD.Velocity2D
      - Altruist.Physx.TwoD.Ballistics2D
      - Altruist.Physx.TwoD.BodyMotionExtensions2D
      - Altruist.Physx.TwoD.RayCastExtensions2D
      - Altruist.Physx.Kinematics
    example: |-
      ```csharp
      using Altruist.Gaming.TwoD;
      using Altruist.Physx.TwoD;

      if (jumpPressed && onSurface) car.JumpOff(surfaceNormal, cfg.JumpSpeed);
      if (grounded)
      {
          car.DriveAlong(tangent, throttle * cfg.MaxSpeed, cfg.Acceleration, dt);
          car.StickTo(groundNormal, cfg.Grip, dt);
      }
      else
      {
          car.ApplyDrag(cfg.AirDrag, dt);
      }
      ball.Fall(gravity, dt, gravityScale: 1f);
      ```

  - name: collisions
    title: Collision Handlers and Contact Routing
    summary: >-
      Two ways to react to collisions. Mark a class [CollisionHandler] and its [CollisionEvent] methods get CollisionEnter, Stay, Exit, Hit and
      the visibility events for the two entity types you name. For a standalone 2D world, ContactRouter2D routes Box2D contacts by the types of the
      two fixture tags and always passes the pair in the same order.
    use:
      - When a player entering a monster's range, a pickup or a trigger volume must run game code.
      - When you listen to a 2D physics world's contacts and want typed handlers, filters and impulse callbacks.
    avoid:
      - When you only need visible and invisible events for packets. Use [visibility].
      - When you need damage rules. Use the combat package.
    packages:
      - Altruist.Physx
      - Altruist.Gaming
    docs:
      - /docs/gaming/physics/collisions
    paths:
      - Altruist/Physx/Core/Common/CollisionHandler/
      - Altruist/Physx/Core/Attributes/
      - Altruist/Physx/Core/Config/
      - Altruist/Physx/Core/2D/Contacts/
      - Altruist/Gaming/Main/Core/3D/World/SpatialCollisionDispatcher.cs
    types:
      - Altruist.Physx.CollisionHandlerAttribute
      - Altruist.Physx.CollisionEventAttribute
      - Altruist.Physx.CollisionEnter
      - Altruist.Physx.CollisionExit
      - Altruist.Physx.TwoD.ContactRouter2D
      - Altruist.Gaming.SpatialCollisionDispatcher
    example: |-
      ```csharp
      using Altruist.Physx;

      [CollisionHandler]
      public class ProximityHandler
      {
          [CollisionEvent(typeof(CollisionEnter))]
          public void OnPlayerNearMonster(CollisionEnter _, PlayerEntity player, MonsterEntity monster)
          {
              // set aggro
          }

          [CollisionEvent(typeof(CollisionExit))]
          public void OnPlayerLeft(CollisionExit _, PlayerEntity player, MonsterEntity monster) { }
      }
      ```

      ```csharp
      // Standalone 2D world: contacts routed by tag type, pair always (A = first type).
      var router = new ContactRouter2D()
          .OnPreSolve((in RoutedContact2D<SurfaceTag, VehicleTag> c) => Record(c.GetWorldManifold().Normal))
          .OnPostSolve((in RoutedContact2D<BallTag, SurfaceTag> c, float impulse) => Thud(impulse));
      world.SetContactListener(router);
      ```

