  - name: worlds-2d
    title: 2D Worlds
    summary: >-
      The 2D implementation of worlds: the 2D organizer and manager, the 2D partitioner and spatial grid, the force runtime,
      and the loader for the 2D world JSON. Use it when altruist:environment:mode is 2D.
    use:
