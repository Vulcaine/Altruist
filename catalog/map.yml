      ```csharp
      using Altruist;
      using Altruist.Networking;

      // Deriving from PairingPortal turns pairing on for this route
      [Portal("/pair")]
      public sealed class PairPortal : PairingPortal
      {
          public PairPortal(IAltruistRouter router, PairingSessions sessions) : base(router, sessions) { }
      }
      ```

      ```yaml
      altruist:
        server:
          pairing:
            max-companions: 4
            code-length: 6
            max-sessions: 10000
            max-payload-bytes: 16384
      ```

  - name: http-api
    title: HTTP API
    summary: >-
      The HTTP side of the server: host, port and path of the ASP.NET Core app, plus what a public API needs. That is one error format, hardening (forwarded headers, security headers, body limits), named rate-limit policies that work across a fleet, and token-guarded access to the dashboard.
