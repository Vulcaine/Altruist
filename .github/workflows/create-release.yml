name: Create Release PR

on:
  workflow_dispatch:  # Button trigger from GitHub UI

# GITHUB_TOKEN only reads; the PR itself is opened with ACTION_PAT.
permissions:
  contents: read
  pull-requests: read

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Required to diff between branches

      - name: 📖 Read version
        id: read_version
        run: echo "version=$(cat Altruist/version.txt)" >> $GITHUB_OUTPUT

      - name: 📋 Get merged PR titles
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list \
            --base main \
            --head staging \
            --state merged \
            --json number,title \
            --jq '.[] | "- #" + (.number|tostring) + ": " + .title')

          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$prs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🔁 Create PR via GitHub REST API
        # Step outputs reach the script through env, never spliced into it: PR titles are user-controlled.
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT }}
          VERSION: ${{ steps.read_version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.log }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TITLE="Release/$VERSION"
          BODY="## 📝 Changelog

          Commits between \`staging\` and \`main\`:

          $CHANGELOG
          "

          echo "Creating PR: $TITLE"

          curl -s -X POST "https://api.github.com/repos/$REPOSITORY/pulls" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg head "staging" \
              --arg base "main" \
              --arg body "$BODY" \
              '{title: $title, head: $head, base: $base, body: $body}')"
