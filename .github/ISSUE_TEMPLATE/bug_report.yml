name: Bug report
description: Something in Altruist doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Altruist version
      placeholder: 0.10.1-beta
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or config that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET version, transport, database.
