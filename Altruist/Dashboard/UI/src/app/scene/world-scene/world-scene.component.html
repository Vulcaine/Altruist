@if (world) {
<div class="world-scene-root">
  <div class="world-scene-viewport" #viewport></div>
  <label class="world-speed-control" (wheel)="onSpeedWheel($event)">
    <span>Move Speed</span>
    <input
      type="number"
      min="0.5"
      max="100"
      step="0.1"
      [value]="cameraSpeedMultiplier.toFixed(1)"
      (change)="onSpeedInput($event)"
      (keydown)="$event.stopPropagation()"
      (pointerdown)="$event.stopPropagation()"
    />
    <strong>x</strong>
  </label>
  <div class="world-clip-control">
    <label>
      <span>Near</span>
      <input
        type="number"
        min="0.01"
        step="0.1"
        [(ngModel)]="cameraNear"
        (change)="onClipInput()"
        (keydown)="$event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      />
    </label>
    <label>
      <span>Far</span>
      <input
        type="number"
        min="1"
        step="100"
        [(ngModel)]="cameraFar"
        (change)="onClipInput()"
        (keydown)="$event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      />
    </label>
  </div>
</div>
}
