version: "3.8"

services:
  sonarqube-db: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service -- writes run/temp files outside its volumes
    security_opt:
      - no-new-privileges:true
    image: postgres:15
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service -- writes run/temp files outside its volumes
    security_opt:
      - no-new-privileges:true
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "127.0.0.1:9000:9000" # local analysis only; the sonar/sonar credentials never leave this machine
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
